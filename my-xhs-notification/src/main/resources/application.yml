server:
  port: 19013
  shutdown: graceful
  tomcat:
    threads:
      max: 400       # SSE 长连接占线程，需要更大线程池
      min-spare: 50
    max-connections: 10000
    accept-count: 200

spring:
  application:
    name: my-xhs-notification
  datasource:
    url: jdbc:mysql://localhost:13306/my_xhs_notification?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "Xhs@2026#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 60000
  data:
    redis:
      host: localhost
      port: 16379
      password: "Xhs@2026#Redis"
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: false
        server-addr: 127.0.0.1:18848
        file-extension: yaml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # SSE 异步请求超时（0 = 永不超时，由心跳保活）
  mvc:
    async:
      request-timeout: -1

# RocketMQ 配置
rocketmq:
  name-server: 127.0.0.1:9876
  consumer:
    group: notification-consumer-group
  producer:
    group: notification-producer-group
    send-message-timeout: 3000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Redisson 配置
redisson:
  address: redis://localhost:16379
  password: "Xhs@2026#Redis"

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      appname: my-xhs-notification
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info