server:
  port: 19009
  shutdown: graceful
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 100
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  application:
    name: my-xhs-inventory
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  datasource:
    readwrite:
      enabled: true  # 读写分离开关
    # 写库（主库）
    master:
      url: jdbc:mysql://21.91.124.110:13309/my_xhs_inventory?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
    # 读库（从库，当前指向同库，部署从库后修改端口）
    slave:
      url: jdbc:mysql://21.91.124.110:13309/my_xhs_inventory?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 10  # 读库连接池可以小一些
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
  data:
    redis:
      host: 21.91.124.110
      port: 16379
      password: "Xhs@2026#Redis"
      # Sentinel 高可用配置（取消注释启用 Sentinel 模式，自动覆盖 host:port）
      # sentinel:
      #   master: myMaster
      #   nodes: 21.91.124.110:26379,21.91.124.110:26380,21.91.124.110:26381
      cache:
        port: 16380  # Cache Redis (allkeys-lru)
      business:
        port: 16381  # Business Redis (noeviction)
      lettuce:
        pool:
          max-active: 25
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.91.124.110:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: true
        server-addr: 21.91.124.110:18848
        import-check:
          enabled: false
        file-extension: yaml
        # Nacos 动态配置示例（myxhs-dynamic.yml）：
        # myxhs:
        #   dynamic:
        #     degrade:
        #       cache: false       # 缓存降级开关
        #       mq: false          # MQ 降级开关
        #       feign: false       # Feign 降级开关
        #       db: false          # 数据库降级开关
        #       search: false      # 搜索降级开关
        #     threshold:
        #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
        #       lock-timeout-ms: 3000  # 分布式锁超时
    sentinel:
      transport:
        dashboard: 21.91.124.110:18082
        port: 8728
      eager: true
      datasource:
        degrade:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-inventory-degrade-rules
            rule-type: degrade
      feign:
        sentinel:
          enabled: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 500
            read-timeout: 3000
            logger-level: BASIC
      compression:
        request:
          enabled: true
          mime-types: application/json
        response:
          enabled: true
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ 配置
rocketmq:
  name-server: 21.91.124.110:9876
  producer:
    group: inventory-producer-group
    send-message-timeout: 3000
  consumer:
    group: inventory-consumer-group

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 库存分桶配置
inventory:
  bucket:
    default-count: 2    # 普通 SKU 默认分桶数
    hot-count: 8         # 热点 SKU 分桶数
  prededuct:
    expire-seconds: 1800 # 预扣记录过期时间（30分钟）

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://21.91.124.110:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      port: 9996
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30