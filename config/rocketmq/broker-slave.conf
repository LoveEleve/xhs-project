# ==========================================
# MyXHS RocketMQ Slave Broker 配置
# 角色：Slave，从 Master 同步数据，提供读服务和故障切换
# ==========================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 1                          # Slave 节点 ID（Master=0, Slave>=1）
deleteWhen = 04                       # 凌晨 4 点删除过期文件
fileReservedTime = 48                 # CommitLog 文件保留 48 小时
brokerRole = SLAVE                    # 从节点角色
flushDiskType = ASYNC_FLUSH           # 异步刷盘（生产环境建议同步刷盘 SYNC_FLUSH）

# 双 NameServer（高可用，分号分隔）
namesrvAddr = 21.130.247.89:9876;21.130.247.89:9877

# 网络配置（Slave 使用不同端口避免冲突）
brokerIP1 = 21.130.247.89
listenPort = 11912                    # Slave Broker 端口（Master 用 11911）

# 存储路径
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
