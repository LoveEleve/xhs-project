# ==========================================
# MyXHS RocketMQ Master Broker 配置
# 角色：ASYNC_MASTER（异步主节点）
# 刷盘：SYNC_FLUSH（P-D11 同步刷盘，防断电丢消息）
# 注意：Java Properties 解析中行内 # 属于值的一部分——
#       所有注释必须独立成行，禁止行内注释（否则配置静默失效）
# ==========================================

brokerClusterName = DefaultCluster
brokerName = broker-a

# Master 节点 ID
brokerId = 0

# 凌晨 4 点删除过期文件
deleteWhen = 04

# CommitLog 文件保留 48 小时
fileReservedTime = 48

# 异步主节点
brokerRole = ASYNC_MASTER

# P-D11: 同步刷盘（防断电丢最近消息）
flushDiskType = SYNC_FLUSH

# namesrv 地址
namesrvAddr = 21.130.247.89:9876

# broker 对外 IP
brokerIP1 = 21.130.247.89

listenPort = 11911
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog

# P-D11: 关闭自动建主题（防 typos 静默建 topic），新主题需显式创建
autoCreateTopicEnable = false

brokerPermission = 6

# 4MB
maxMessageSize = 4194304

sendMessageThreadPoolNums = 16
pullMessageThreadPoolNums = 16
queryMessageThreadPoolNums = 8

# P-D23: 内置 Prometheus exporter(中间件自监控, micrometer)
metricsExporterType = PROM
metricsPromExporterPort = 9160
