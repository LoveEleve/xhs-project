# ==========================================
# MyXHS RocketMQ Master Broker 配置
# 角色：ASYNC_MASTER（异步主节点）
# 刷盘：ASYNC_FLUSH（异步刷盘，平衡性能与可靠性）
# ==========================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0                          # Master 节点 ID
deleteWhen = 04                       # 凌晨 4 点删除过期文件
fileReservedTime = 48                 # CommitLog 文件保留 48 小时
brokerRole = ASYNC_MASTER             # 异步主节点
flushDiskType = ASYNC_FLUSH           # 异步刷盘（金融级场景建议改为 SYNC_FLUSH）

# 单 NameServer（精简版）
namesrvAddr = 21.130.247.89:9876

# 网络配置
brokerIP1 = 21.130.247.89
listenPort = 11911

# 存储路径
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog

# 开发/测试环境：允许自动创建 Topic（生产环境应设置为 false）
autoCreateTopicEnable = true

# Broker 权限：6 = 可读可写（4=只读, 2=只写, 6=读写）
brokerPermission = 6

# 消息大小限制
maxMessageSize = 4194304              # 4MB

# 发送消息线程池
sendMessageThreadPoolNums = 16

# 拉取消息线程池
pullMessageThreadPoolNums = 16

# 查询消息线程池
queryMessageThreadPoolNums = 8
