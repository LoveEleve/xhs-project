input {
  file {
    path => "/logs/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  # 从日志文件路径提取服务名（/logs/my-xhs-user.json → my-xhs-user）
  grok {
    match => { "[log][file][path]" => "/logs/(?<service>[^/]+)\.json" }
  }
  # 时间戳处理
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["localhost:19200"]
    user => "elastic"
    password => "Xhs@2026#Elastic"
    index => "myxhs-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
