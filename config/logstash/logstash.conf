# ==========================================
# MyXHS Logstash 管道配置
# 输入：Filebeat（Beats input, port 15044）
# 输出：Elasticsearch（业务 ES, port 19200）
# ==========================================

input {
  beats {
    port => 15044
  }
}

filter {
  # 从日志文件路径提取服务名（/logs/my-xhs-user.json → my-xhs-user）
  if [log][file][path] {
    grok {
      match => { "[log][file][path]" => "/logs/(?<service>[^/]+)\.json" }
    }
  }
  # 时间戳处理
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["21.130.247.89:19200"]
    user => "elastic"
    password => "Xhs@2026#Elastic"
    index => "myxhs-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
