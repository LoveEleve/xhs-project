# ==========================================
# MyXHS Logstash 管道配置
# 输入：TCP(微服务直连, port 15044) + Beats(Filebeat采集, port 15045)
# 输出：Elasticsearch（业务 ES, port 19200）
# ==========================================

input {
  tcp {
    port => 15044
    codec => json_lines
  }
  beats {
    port => 15045
  }
}

filter {
  # 从 Filebeat 日志文件路径提取服务名（/logs/my-xhs-user.json → my-xhs-user）
  if [log][file][path] {
    grok {
      match => { "[log][file][path]" => "/logs/(?<service>[^/]+)\.json" }
    }
  }
  # 时间戳处理
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["127.0.0.1:19200"]
    user => "elastic"
    password => "Xhs@2026#Elastic"
    index => "myxhs-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
