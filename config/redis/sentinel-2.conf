# ==========================================
# MyXHS Redis Sentinel-2 配置
# 端口：26380
# ==========================================

port 26380

# 对外宣告 IP（跨网络访问时 Sentinel 返回此 IP 而非 127.0.0.1）
sentinel announce-ip 21.130.247.89

sentinel monitor mymaster 21.130.247.89 16379 2
sentinel auth-pass mymaster Xhs@2026#Redis

sentinel monitor mymaster-cache 21.130.247.89 16380 2
sentinel auth-pass mymaster-cache Xhs@2026#Redis

sentinel monitor mymaster-business 21.130.247.89 16381 2
sentinel auth-pass mymaster-business Xhs@2026#Redis

sentinel down-after-milliseconds mymaster 5000
sentinel down-after-milliseconds mymaster-cache 5000
sentinel down-after-milliseconds mymaster-business 5000

sentinel failover-timeout mymaster 30000
sentinel failover-timeout mymaster-cache 30000
sentinel failover-timeout mymaster-business 30000

sentinel parallel-syncs mymaster 1
sentinel parallel-syncs mymaster-cache 1
sentinel parallel-syncs mymaster-business 1
