server:
  port: 19015
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true  # B3（2026-08-13）：暴露 tomcat.threads 指标
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  config:
    import:
      - optional:nacos:my-xhs-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-home
  # BFF 层无数据库，排除需要 DataSource 的自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      host: 192.168.0.142
      # Redis 密码 — Nacos 配置(my-xhs-common.yaml) 优先，本地为 fallback
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 192.168.0.142:26379
      business:
        port: 6379
      cache:
        port: 6379
      lettuce:
        pool:
          max-active: 30
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    loadbalancer:
      cache:
        enabled: false
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        file-extension: yaml
        # Nacos 动态配置示例（myxhs-dynamic.yml）：
        # myxhs:
        #   dynamic:
        #     degrade:
        #       cache: false       # 缓存降级开关
        #       mq: false          # MQ 降级开关
        #       feign: false       # Feign 降级开关
        #       db: false          # 数据库降级开关
        #       search: false      # 搜索降级开关
        #     threshold:
        #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
        #       lock-timeout-ms: 3000  # 分布式锁超时
    sentinel:
      transport:
        dashboard: 192.168.0.142:8858
        port: 8725
      eager: true
      # Sentinel 舱壁隔离规则（通过 Nacos 动态配置推送）：
      # - resource: my-xhs-inventory → threadPoolMaxSize=10, maxQueueSize=20
      # - resource: my-xhs-order → threadPoolMaxSize=15, maxQueueSize=30
      # - resource: my-xhs-coupon → threadPoolMaxSize=8, maxQueueSize=15
      # - resource: my-xhs-product → threadPoolMaxSize=10, maxQueueSize=20
      # 其他 resource 使用默认值 threadPoolMaxSize=5, maxQueueSize=10
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
      client:
        config:
          default:
            request-interceptors:
              - com.myxhs.feign.config.FeignInternalCallInterceptor
            connect-timeout: 3000
            read-timeout: 3000
            logger-level: BASIC
  lifecycle:
    timeout-per-shutdown-phase: 30s

# RocketMQ 配置（消费笔记发布事件，推送到粉丝收件箱）
rocketmq:
  name-server: 192.168.0.142:9876
  consumer:
    group: home-consumer-group

# Feign 客户端配置
feign:
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# BFF 聚合线程池
home:
  aggregator:
    core-pool-size: 20
    max-pool-size: 50
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: "home-aggregator-"
  feed:
    # 大V粉丝数阈值（超过此值走拉模式）
    big-v-threshold: 100000
    # 收件箱最大保留天数
    inbox-max-days: 7
    # 收件箱单次拉取最大条数
    inbox-max-size: 500
    # 默认每页大小
    default-page-size: 20

# Actuator 健康检查 + 指标暴露
management:
  metrics:
    distribution:
      percentiles-histogram:
        # 2026-08-13：Hikari Timer 默认无 bucket（仅 count/sum/max）——开启后才有 _bucket，histogram_quantile 可用
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        hikaricp.connections.creation: true
        # 业务延迟 Timer（2026-08-13：默认无 bucket——开 percentileHistogram 后 histogram_quantile 可用，biz 看板配套）
        feed.push.latency: true
        orders.create.latency: true
        inventory.prededuct.latency: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false
    redis-reactivestreams:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://192.168.0.142:18080/xxl-job-admin
    accessToken: ${XXL_JOB_TOKEN:my-xhs-xxl-job-token-2026}
    executor:
      appname: my-xhs-home
      port: 9994
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
jwt:
  secret: ${JWT_SECRET:MyXhs@2026#JwtSecretKey!ForTokenSign}

# 内部调用令牌（review 2026-09-19：guard 依赖此配置，缺失会 fail-closed 拒绝全部内部调用）
myxhs:
  internal:
    token: ${INTERNAL_TOKEN:}
