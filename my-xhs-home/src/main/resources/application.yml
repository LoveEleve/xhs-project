server:
  port: 19015
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-home
  # BFF 层无数据库，排除需要 DataSource 的自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      # 【Nacos 配置】Redis 密码已迁移至 Nacos Config（my-xhs-redis.yaml），本地值为 fallback
      password: "Xhs@2026#Redis"
      sentinel:
        master: mymaster
        nodes: 21.130.247.89:26379,21.130.247.89:26380,21.130.247.89:26381
      cache:
        port: 16380  # Cache Redis (allkeys-lru)
      business:
        port: 16381  # Business Redis (noeviction)
      lettuce:
        pool:
          max-active: 30
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.130.247.89:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 21.130.247.89:18848
        import-check:
          enabled: false
        file-extension: yaml
        # Nacos 动态配置示例（myxhs-dynamic.yml）：
        # myxhs:
        #   dynamic:
        #     degrade:
        #       cache: false       # 缓存降级开关
        #       mq: false          # MQ 降级开关
        #       feign: false       # Feign 降级开关
        #       db: false          # 数据库降级开关
        #       search: false      # 搜索降级开关
        #     threshold:
        #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
        #       lock-timeout-ms: 3000  # 分布式锁超时
    sentinel:
      transport:
        dashboard: 21.130.247.89:18082
        port: 8725
      eager: true
      datasource:
        degrade:
          nacos:
            server-addr: 21.130.247.89:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-home-degrade-rules
            rule-type: degrade
      feign:
        sentinel:
          enabled: true
      # Sentinel 舱壁隔离规则（通过 Nacos 动态配置推送）：
      # - resource: my-xhs-inventory → threadPoolMaxSize=10, maxQueueSize=20
      # - resource: my-xhs-order → threadPoolMaxSize=15, maxQueueSize=30
      # - resource: my-xhs-coupon → threadPoolMaxSize=8, maxQueueSize=15
      # - resource: my-xhs-product → threadPoolMaxSize=10, maxQueueSize=20
      # 其他 resource 使用默认值 threadPoolMaxSize=5, maxQueueSize=10
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# RocketMQ 配置（消费笔记发布事件，推送到粉丝收件箱）
rocketmq:
  name-server: 21.130.247.89:9876;21.130.247.89:9877
  consumer:
    group: home-consumer-group

# Feign 客户端配置（通过 Nacos 服务发现调用）
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 3000
        logger-level: BASIC

# BFF 聚合线程池
home:
  aggregator:
    core-pool-size: 20
    max-pool-size: 50
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: "home-aggregator-"
  feed:
    # 大V粉丝数阈值（超过此值走拉模式）
    big-v-threshold: 100000
    # 收件箱最大保留天数
    inbox-max-days: 7
    # 收件箱单次拉取最大条数
    inbox-max-size: 500
    # 默认每页大小
    default-page-size: 20

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://21.130.247.89:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      port: 9994
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30