name: deploy-cart
on: [workflow_dispatch]
jobs:
  deploy:
    runs-on: local
    steps:
      - name: 拉取代码
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch main "http://x-access-token:${GH_TOKEN}@192.168.0.142:3000/ci/my-xhs.git" .
      - name: 蓝绿发布 cart（含自动回滚）
        run: bash scripts/release-service.sh cart
