server:
  port: 19016
  shutdown: graceful
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 150
      min-spare: 15
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  application:
    name: my-xhs-search
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  datasource:
    readwrite:
      enabled: true  # 读写分离开关
    # 写库（主库）
    master:
      url: jdbc:mysql://21.91.124.110:13307/my_xhs_search?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
    # 读库（从库，指向 slave 实例）
    slave:
      url: jdbc:mysql://21.91.124.110:13311/my_xhs_search?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 10  # 读库连接池可以小一些
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
  data:
    redis:
      host: 21.91.124.110
      port: 16379
      # 【Nacos 配置】Redis 密码已迁移至 Nacos Config（my-xhs-redis.yaml），本地值为 fallback
      password: ${spring.data.redis.password:"Xhs@2026#Redis"}
      # Sentinel 高可用配置（取消注释启用 Sentinel 模式，自动覆盖 host:port）
      # sentinel:
      #   master: myMaster
      #   nodes: 21.91.124.110:26379,21.91.124.110:26380,21.91.124.110:26381
      cache:
        port: 16380  # Cache Redis (allkeys-lru)
      business:
        port: 16381  # Business Redis (noeviction)
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.91.124.110:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: true
        server-addr: 21.91.124.110:18848
        import-check:
          enabled: false
        file-extension: yaml
    sentinel:
      transport:
        dashboard: 21.91.124.110:18082
        port: 8727
      eager: true
      datasource:
        degrade:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-search-degrade-rules
            rule-type: degrade
      feign:
        sentinel:
          enabled: true
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Elasticsearch 配置
elasticsearch:
  uris: http://21.91.124.110:19200
  username: elastic
  password: Xhs@2026#Elastic
  connect-timeout: 5000
  socket-timeout: 30000

# RocketMQ 配置
rocketmq:
  name-server: 21.91.124.110:9876
  consumer:
    group: search-consumer-group
  producer:
    group: search-producer-group

# 搜索业务配置
search:
  note:
    index-name: note_index
    default-page-size: 20
    max-page-size: 50
  product:
    index-name: product_index
    default-page-size: 20
    max-page-size: 50
  suggest:
    index-name: suggest_index
    max-suggestions: 10
    cache-ttl-seconds: 3600
  history:
    max-size: 20
    ttl-days: 30
  rebuild:
    batch-size: 500
    cron: "0 0 4 * * ?"
  hot:
    decay-lambda: 0.1
    window-minutes: 60
    top-size: 50
    antispam:
      user-ttl-seconds: 300
      ip-max-per-minute: 10

# 推荐系统配置
recommend:
  recall:
    size-per-strategy: 100
    timeout-ms: 2000
  feed:
    size: 20

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
    co.elastic.clients: warn

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://21.91.124.110:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      port: 9997
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30