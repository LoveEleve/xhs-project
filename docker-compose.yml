version: '3.8'

services:
  # ==========================================
  # MySQL-User — 端口 13306
  # 承载：user + analytics + notification + im + nacos_config + xxl_job
  # ==========================================
  mysql-user:
    image: mysql:8.0
    container_name: my-xhs-mysql-user
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13306
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=300
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-row-image=FULL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13306", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-user-data:/var/lib/mysql
      - ./sql/mysql-user-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/init-replication-user-master.sql:/docker-entrypoint-initdb.d/02-replication-user.sql
    restart: unless-stopped

  # ==========================================
  # MySQL-Content — 端口 13307
  # 承载：content + counter + search + product + cart + coupon
  # ==========================================
  mysql-content:
    image: mysql:8.0
    container_name: my-xhs-mysql-content
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13307
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=300
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-row-image=FULL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13307", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-content-data:/var/lib/mysql
      - ./sql/mysql-content-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/init-replication-user-master.sql:/docker-entrypoint-initdb.d/02-replication-user.sql
    restart: unless-stopped

  # ==========================================
  # MySQL-Order — 端口 13308
  # 承载：order（4 分片库）+ payment + 订单号映射表
  # ==========================================
  mysql-order:
    image: mysql:8.0
    container_name: my-xhs-mysql-order
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13308
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=512M
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=3
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-row-image=FULL
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4g
        reservations:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13308", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-order-data:/var/lib/mysql
      - ./sql/mysql-order-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/init-replication-user-master.sql:/docker-entrypoint-initdb.d/02-replication-user.sql
    restart: unless-stopped

  # ==========================================
  # MySQL-Inventory — 端口 13309
  # 库存独立部署：最高写争用（行锁），单独隔离
  # ==========================================
  mysql-inventory:
    image: mysql:8.0
    container_name: my-xhs-mysql-inventory
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13309
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.2
      --server-id=4
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-row-image=FULL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13309", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-inventory-data:/var/lib/mysql
      - ./sql/mysql-inventory-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/init-replication-user-master.sql:/docker-entrypoint-initdb.d/02-replication-user.sql
    restart: unless-stopped

  # ==========================================
  # MySQL-User-Slave — 端口 13310
  # 主从复制：mysql-user:13306 (Master) → :13310 (Slave)
  # ==========================================
  mysql-user-slave:
    image: mysql:8.0
    container_name: my-xhs-mysql-user-slave
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13310
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=300
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=101
      --log-bin=mysql-bin
      --log-slave-updates
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --skip-slave-start
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13310", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-user-slave-data:/var/lib/mysql
      - ./sql/init-replication-user.sql:/docker-entrypoint-initdb.d/01-init-replication.sql
    depends_on:
      - mysql-user
    restart: unless-stopped

  # ==========================================
  # MySQL-Content-Slave — 端口 13311
  # 主从复制：mysql-content:13307 (Master) → :13311 (Slave)
  # ==========================================
  mysql-content-slave:
    image: mysql:8.0
    container_name: my-xhs-mysql-content-slave
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13311
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=300
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=102
      --log-bin=mysql-bin
      --log-slave-updates
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --skip-slave-start
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13311", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-content-slave-data:/var/lib/mysql
      - ./sql/init-replication-content.sql:/docker-entrypoint-initdb.d/01-init-replication.sql
    depends_on:
      - mysql-content
    restart: unless-stopped

  # ==========================================
  # MySQL-Order-Slave — 端口 13312
  # 主从复制：mysql-order:13308 (Master) → :13312 (Slave)
  # ==========================================
  mysql-order-slave:
    image: mysql:8.0
    container_name: my-xhs-mysql-order-slave
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13312
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=512M
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.5
      --server-id=103
      --log-bin=mysql-bin
      --log-slave-updates
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --skip-slave-start
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4g
        reservations:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13312", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-order-slave-data:/var/lib/mysql
      - ./sql/init-replication-order.sql:/docker-entrypoint-initdb.d/01-init-replication.sql
    depends_on:
      - mysql-order
    restart: unless-stopped

  # ==========================================
  # MySQL-Inventory-Slave — 端口 13313
  # 主从复制：mysql-inventory:13309 (Master) → :13313 (Slave)
  # ==========================================
  mysql-inventory-slave:
    image: mysql:8.0
    container_name: my-xhs-mysql-inventory-slave
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: Xhs@2026#MySQL
      TZ: Asia/Shanghai
    command: >
      --port=13313
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=200
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow-query.log
      --long-query-time=0.2
      --server-id=104
      --log-bin=mysql-bin
      --log-slave-updates
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=ON
      --skip-slave-start
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "13313", "-u", "root", "-pXhs@2026#MySQL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mysql-inventory-slave-data:/var/lib/mysql
      - ./sql/init-replication-inventory.sql:/docker-entrypoint-initdb.d/01-init-replication.sql
    depends_on:
      - mysql-inventory
    restart: unless-stopped

  # ==========================================
  # Redis — 3 实例分离 + 3 Sentinel 哨兵
  # 端口规划：
  #   16379 — 主 Redis（Spring Boot 默认连接，allkeys-lru）
  #   16380 — Cache Redis（缓存数据，allkeys-lru）
  #   16381 — Business Redis（核心业务数据，noeviction）
  #   26379 — Sentinel-1
  #   26380 — Sentinel-2
  #   26381 — Sentinel-3
  # ==========================================

  # Business Redis — 端口 16381，noeviction（保护核心业务数据不丢失）
  redis-business:
    image: redis:7-alpine
    container_name: my-xhs-redis-business
    network_mode: host
    command: >
      redis-server
      --port 16381
      --bind 0.0.0.0
      --requirepass Xhs@2026#Redis
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16381", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-business-data:/data
    restart: unless-stopped

  # Cache Redis — 端口 16380，allkeys-lru（缓存数据可丢弃）
  redis-cache:
    image: redis:7-alpine
    container_name: my-xhs-redis-cache
    network_mode: host
    command: >
      redis-server
      --port 16380
      --bind 0.0.0.0
      --requirepass Xhs@2026#Redis
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16380", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

  # 主 Redis（Spring Boot 默认连接）— 端口 16379，allkeys-lru
  redis:
    image: redis:7-alpine
    container_name: my-xhs-redis
    network_mode: host
    command: >
      redis-server
      --port 16379
      --bind 0.0.0.0
      --requirepass Xhs@2026#Redis
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Redis Sentinel × 3（哨兵模式 — 自动故障转移）
  # quorum=2：至少 2 个 Sentinel 认为主节点下线才触发故障转移
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-1
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-1.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-cache
      - redis-business
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-2
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-2.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-cache
      - redis-business
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-3
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-3.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-cache
      - redis-business
    restart: unless-stopped

  # ==========================================
  # Sentinel Dashboard 1.8.8 — 端口 18082
  # ==========================================
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: my-xhs-sentinel-dashboard
    network_mode: host
    environment:
      SERVER_PORT: 18082
    restart: unless-stopped

  # ==========================================
  # Nacos 2.3 — 端口 18848/18849/18850
  # ==========================================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: my-xhs-nacos
    network_mode: host
    environment:
      MODE: standalone
      NACOS_SERVER_PORT: 18848
      NACOS_SERVER_IP: 21.91.124.110
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: 127.0.0.1
      MYSQL_SERVICE_PORT: 13306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: Xhs@2026#MySQL
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_EXTRA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:MaxMetaspaceSize=256m"
    depends_on:
      - mysql-user
    restart: unless-stopped

  # ==========================================
  # RocketMQ NameServer × 2（高可用）
  # ==========================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-namesrv
    network_mode: host
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  rocketmq-namesrv-2:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-namesrv-2
    network_mode: host
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ==========================================
  # RocketMQ Broker-Master — 端口 11911
  # ==========================================
  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-broker
    network_mode: host
    command: sh mqbroker -n 127.0.0.1:9876;127.0.0.1:9877 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:11911 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
      - mq-logs:/home/rocketmq/logs
      - mq-store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
      - rocketmq-namesrv-2
    restart: unless-stopped

  # ==========================================
  # RocketMQ Broker-Slave — 端口 11912
  # ==========================================
  rocketmq-broker-slave:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-broker-slave
    network_mode: host
    command: sh mqbroker -n 127.0.0.1:9876;127.0.0.1:9877 -c /home/rocketmq/rocketmq-5.1.4/conf/broker-slave.conf
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config/rocketmq/broker-slave.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker-slave.conf
      - mq-logs-slave:/home/rocketmq/logs
      - mq-store-slave:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
      - rocketmq-namesrv-2
    restart: unless-stopped

  # ==========================================
  # Elasticsearch 8.12 — 端口 19200/19300
  # ==========================================
  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: my-xhs-elasticsearch
    network_mode: host
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=Xhs@2026#Elastic
      - http.port=19200
      - transport.port=19300
      - ES_JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:MaxMetaspaceSize=256m
      - cluster.name=my-xhs-es
      - node.name=es-node-1
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:Xhs@2026#Elastic http://127.0.0.1:19200/_cluster/health?local=true | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    restart: unless-stopped

  # ==========================================
  # Logstash 8.12.2 — 日志聚合管道，采集 JSON 日志 → ES
  # ==========================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: myxhs-logstash
    network_mode: host
    environment:
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/logs:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ==========================================
  # Kibana 8.12.2 — 日志可视化，端口 15601
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: myxhs-kibana
    network_mode: host
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:19200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=Xhs@2026#Elastic
      - SERVER_PORT=15601
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ==========================================
  # Canal 1.1.7 — MySQL Binlog → RocketMQ → ES/Redis
  # note_instance: mysql-content:13307 → RocketMQ → ES note_index
  # product_instance: mysql-content:13307 → RocketMQ → ES product_index
  # inventory_instance: mysql-inventory:13309 → RocketMQ → Redis 缓存失效
  # ==========================================
  canal:
    image: canal/canal-server:v1.1.7
    container_name: my-xhs-canal
    network_mode: host
    volumes:
      - ./config/canal/conf/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal/conf/note_instance/instance.properties:/home/admin/canal-server/conf/note_instance/instance.properties
      - ./config/canal/conf/product_instance/instance.properties:/home/admin/canal-server/conf/product_instance/instance.properties
      - ./config/canal/conf/inventory_instance/instance.properties:/home/admin/canal-server/conf/inventory_instance/instance.properties
      - canal-data:/home/admin/canal-server/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:11111 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - mysql-content
      - mysql-inventory
      - rocketmq-broker
    restart: unless-stopped

  # ==========================================
  # XXL-Job Admin 2.4.2 — 端口 18080
  # ==========================================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: my-xhs-xxl-job-admin
    network_mode: host
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://127.0.0.1:13306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=Xhs@2026#MySQL
        --server.port=18080
        --xxl.job.accessToken=my-xhs-xxl-job-token-2026
        --xxl.job.i18n=zh_CN
    depends_on:
      - mysql-user
    restart: unless-stopped

  # ==========================================
  # Prometheus 2.48 — 端口 19090
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: my-xhs-prometheus
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:19090'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alert_rules:/etc/prometheus/alert_rules
      - prometheus-data:/prometheus
    restart: unless-stopped

  # ==========================================
  # Grafana 10 — 端口 13000
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: my-xhs-grafana
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=13000
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Xhs@2026#Grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped

  # ==========================================
  # SkyWalking OAP 9.7.0 — 链路追踪后端
  # ==========================================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: my-xhs-skywalking-oap
    network_mode: host
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: 127.0.0.1:19200
    restart: unless-stopped

  # ==========================================
  # SkyWalking UI 9.7.0 — 链路追踪控制台
  # ==========================================
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: my-xhs-skywalking-ui
    network_mode: host
    environment:
      SW_OAP_ADDRESS: http://127.0.0.1:12800
      SW_SERVER_PORT: 18081
    depends_on:
      - skywalking-oap
    restart: unless-stopped

volumes:
  mysql-user-data:
  mysql-user-slave-data:
  mysql-content-data:
  mysql-content-slave-data:
  mysql-order-data:
  mysql-order-slave-data:
  mysql-inventory-data:
  mysql-inventory-slave-data:
  redis-data:
  redis-cache-data:
  redis-business-data:
  mq-logs:
  mq-store:
  mq-logs-slave:
  mq-store-slave:
  es-data:
  es-plugins:
  prometheus-data:
  grafana-data:
  canal-data:
