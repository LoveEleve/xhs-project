server:
  port: 19021

spring:
  application:
    name: my-xhs-ai-mcp
  # 只读账号 myxhs_ai_ro（SELECT），密码走环境变量，不落库
  datasource:
    url: ${MYXHS_DB_URL:jdbc:mysql://192.168.0.142:3306/my_xhs_order_0?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYXHS_DB_USER:myxhs_ai_ro}
    password: ${MYXHS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5

# MCP 端点 /mcp（Streamable HTTP），由 mcp-spring-webmvc 提供
logging:
  level:
    root: info

# M9-1 受控日志检索白名单（service=日志文件绝对路径；不在白名单的服务一律拒绝）
myxhs:
  ai:
    log-search:
      files: ${MYXHS_LOG_SEARCH_FILES:my-xhs-order=/data/workspace/my-xhs/logs/my-xhs-order.log,my-xhs-inventory=/data/workspace/my-xhs/logs/my-xhs-inventory.log,my-xhs-payment=/data/workspace/my-xhs/logs/my-xhs-payment.log,my-xhs-gateway=/data/workspace/my-xhs/logs/my-xhs-gateway.log,my-xhs-content=/data/workspace/my-xhs/logs/my-xhs-content.log,my-xhs-user=/data/workspace/my-xhs/logs/my-xhs-user.log}
