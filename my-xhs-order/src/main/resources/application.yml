server:
  port: 19011
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: my-xhs-order
  # ShardingSphere-JDBC 数据源由 ShardingSphereDataSourceConfig 手动创建
  # 不使用 Spring Boot 自动配置的 DataSource
  data:
    redis:
      host: localhost
      port: 16379
      password: "Xhs@2026#Redis"
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: false
        server-addr: 127.0.0.1:18848
        file-extension: yaml
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: localhost:8080
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
      # Nacos 数据源持久化限流规则（Feign 熔断降级规则）
      datasource:
        flow:
          nacos:
            server-addr: 127.0.0.1:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-order-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: 127.0.0.1:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-order-degrade-rules
            rule-type: degrade
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ 配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: order-producer-group
    send-message-timeout: 3000

# Feign 客户端配置（通过 Nacos 服务发现调用）
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# Mock 支付配置
pay:
  type: mock
  # 支付数据源（payment 表在独立库，不走分片）
  datasource:
    url: jdbc:mysql://localhost:13306/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "Xhs@2026#MySQL"

# 订单号映射表数据源（不分片的公共库）
order:
  mapping:
    datasource:
      url: jdbc:mysql://localhost:13306/my_xhs_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: "Xhs@2026#MySQL"

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      appname: my-xhs-order
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
    org.apache.shardingsphere: info