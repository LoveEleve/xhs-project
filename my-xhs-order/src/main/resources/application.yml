server:
  port: 19011
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true  # B3（2026-08-13）：暴露 tomcat.threads 指标
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000
    keep-alive-timeout: 60000
    max-keep-alive-requests: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  config:
    import:
      - optional:nacos:my-xhs-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-order
  # ShardingSphere-JDBC 数据源由 ShardingSphereDataSourceConfig 手动创建
  # 不使用 Spring Boot 自动配置的 DataSource
  # DataSourceAutoConfiguration 已在 OrderApplication.java 中排除
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      # Redis 密码 — Nacos 配置(my-xhs-common.yaml) 优先，本地为 fallback
      host: 192.168.0.142
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 192.168.0.142:26379
      business:
        port: 6379
      cache:
        port: 6379
      lettuce:
        pool:
          max-active: 25
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        file-extension: yaml
        # Nacos 动态配置示例（myxhs-dynamic.yml）：
        # myxhs:
        #   dynamic:
        #     degrade:
        #       cache: false       # 缓存降级开关
        #       mq: false          # MQ 降级开关
        #       feign: false       # Feign 降级开关
        #       db: false          # 数据库降级开关
        #       search: false      # 搜索降级开关
        #     threshold:
        #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
        #       lock-timeout-ms: 3000  # 分布式锁超时
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: 192.168.0.142:8858
        port: 8733
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
      client:
        config:
          default:
            request-interceptors:
              - com.myxhs.feign.config.FeignInternalCallInterceptor
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: BASIC
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ 配置
rocketmq:
  name-server: 192.168.0.142:9876
  producer:
    group: order-producer-group
    # P2/2026-09-27：显式固定客户端默认重试（此前为隐式默认 2 次）；"发送超时≠失败"，双发靠消费者幂等+对账兜底
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
    send-message-timeout: 3000

# Feign 客户端配置（通过 Nacos 服务发现调用）
feign:
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# Mock 支付配置 → 测试环境走真实 payment 服务
pay:
  type: remote
  # 支付数据源（payment 表在独立库，不走分片）
  datasource:
    url: jdbc:mysql://192.168.0.142:3306/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: root
    password: "Xhs@2026#MySQL"

# 订单号映射表数据源（不分片的公共库）
order:
  mapping:
    datasource:
      url: jdbc:mysql://192.168.0.142:3306/my_xhs_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://192.168.0.142:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      appname: my-xhs-order
      port: 9991
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# Actuator 健康检查 + 指标暴露
management:
  metrics:
    distribution:
      percentiles-histogram:
        # 2026-08-13：Hikari Timer 默认无 bucket（仅 count/sum/max）——开启后才有 _bucket，histogram_quantile 可用
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        hikaricp.connections.creation: true
        # 业务延迟 Timer（2026-08-13：默认无 bucket——开 percentileHistogram 后 histogram_quantile 可用，biz 看板配套）
        feed.push.latency: true
        orders.create.latency: true
        inventory.prededuct.latency: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
    org.apache.shardingsphere: info


# 管理/内部接口令牌（环境变量注入，未配置时为空 → 管理接口全部拒绝(fail-closed)）
myxhs:
  admin:
    token: ${ADMIN_TOKEN:}
  internal:
    token: ${INTERNAL_TOKEN:}

jwt:
  secret: ${JWT_SECRET:MyXhs@2026#JwtSecretKey!ForTokenSign}
