server:
  port: 19011
  shutdown: graceful
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 订单(BFF聚合,并发调用)=200, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  application:
    name: my-xhs-order
  # ShardingSphere-JDBC 数据源由 ShardingSphereDataSourceConfig 手动创建
  # 不使用 Spring Boot 自动配置的 DataSource
  # DataSourceAutoConfiguration 已在 OrderApplication.java 中排除
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      host: 21.91.124.110
      port: 16379
      # 【Nacos 配置】Redis 密码已迁移至 Nacos Config（my-xhs-redis.yaml），本地值为 fallback
      password: ${spring.data.redis.password:"Xhs@2026#Redis"}
      # Sentinel 高可用配置（取消注释启用 Sentinel 模式，自动覆盖 host:port）
      # sentinel:
      #   master: myMaster
      #   nodes: 21.91.124.110:26379,21.91.124.110:26380,21.91.124.110:26381
      cache:
        port: 16380  # Cache Redis (allkeys-lru)
      business:
        port: 16381  # Business Redis (noeviction)
      lettuce:
        pool:
          max-active: 25
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.91.124.110:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: true
        server-addr: 21.91.124.110:18848
        import-check:
          enabled: false
        file-extension: yaml
        # Nacos 动态配置示例（myxhs-dynamic.yml）：
        # myxhs:
        #   dynamic:
        #     degrade:
        #       cache: false       # 缓存降级开关
        #       mq: false          # MQ 降级开关
        #       feign: false       # Feign 降级开关
        #       db: false          # 数据库降级开关
        #       search: false      # 搜索降级开关
        #     threshold:
        #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
        #       lock-timeout-ms: 3000  # 分布式锁超时
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: 21.91.124.110:18082
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
      # Sentinel 舱壁隔离规则（通过 Nacos 动态配置推送）：
      # - resource: my-xhs-inventory → threadPoolMaxSize=10, maxQueueSize=20
      # - resource: my-xhs-coupon → threadPoolMaxSize=8, maxQueueSize=15
      # - resource: my-xhs-payment → threadPoolMaxSize=15, maxQueueSize=30
      # 其他 resource 使用默认值 threadPoolMaxSize=5, maxQueueSize=10
      # Nacos 数据源持久化限流规则（Feign 熔断降级规则）
      datasource:
        flow:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-order-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-order-degrade-rules
            rule-type: degrade
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ 配置
rocketmq:
  name-server: 21.91.124.110:9876
  producer:
    group: order-producer-group
    send-message-timeout: 3000

# Feign 客户端配置（通过 Nacos 服务发现调用）
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# Mock 支付配置
pay:
  type: mock
  # 支付数据源（payment 表在独立库，不走分片）
  datasource:
    # 生产环境建议通过环境变量注入：${MYSQL_HOST:21.91.124.110}
    url: jdbc:mysql://21.91.124.110:13308/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: root
    password: "Xhs@2026#MySQL"

# 订单号映射表数据源（不分片的公共库）
order:
  mapping:
    datasource:
      # 生产环境建议通过环境变量注入：${MYSQL_HOST:21.91.124.110}
      url: jdbc:mysql://21.91.124.110:13308/my_xhs_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://21.91.124.110:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
    org.apache.shardingsphere: info