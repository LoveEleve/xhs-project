# ============================================================
# ShardingSphere-JDBC 分库分表配置
# ============================================================
# 架构：同一 MySQL 实例（3306）上 4 个 database × 4 张分表/库 = 16 张逻辑表
# 分片键：user_id
# 库路由：user_id % 4 → ds0(my_xhs_order_0) ~ ds3(my_xhs_order_3)
# 表路由：(user_id / 4) % 4 → t_xxx_0 ~ t_xxx_3
#
# 说明：开发环境使用同一 MySQL 实例的多 database 模拟分库，
#       生产环境只需修改 jdbcUrl 指向不同 MySQL 实例即可水平扩展。
# ============================================================

