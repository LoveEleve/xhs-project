  ds2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://21.130.247.89:3306/my_xhs_order_2?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "Xhs@2026#MySQL"
    connectionTimeoutMilliseconds: 10000
    idleTimeoutMilliseconds: 30000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 10
