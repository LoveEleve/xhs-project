server:
  port: 19000
  shutdown: graceful
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 300
      min-spare: 30
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-gateway
  # Gateway 是 WebFlux 网关，无数据库
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  cloud:
    nacos:
      # Nacos 服务发现（Gateway 需要通过 Nacos 发现下游微服务实例）
      discovery:
        enabled: true
        server-addr: 21.130.247.89:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      # Nacos 配置中心（敏感配置、动态开关等）
      config:
        enabled: true
        server-addr: 21.130.247.89:18848
        namespace: my-xhs
        import-check:
        shared-configs:
          - data-id: my-xhs-common.yaml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: my-xhs-gateway.yaml
            group: DEFAULT_GROUP
            refresh: true
        file-extension: yaml
    sentinel:
      # Nacos 动态配置示例（myxhs-dynamic.yml）：
      # myxhs:
      #   dynamic:
      #     degrade:
      #       cache: false       # 缓存降级开关
      #       mq: false          # MQ 降级开关
      #       feign: false       # Feign 降级开关
      #       db: false          # 数据库降级开关
      #       search: false      # 搜索降级开关
      #     threshold:
      #       slow-sql-ms: 200   # 慢 SQL 阈值（毫秒）
      #       lock-timeout-ms: 3000  # 分布式锁超时
      # Sentinel 控制台配置（当前未部署控制台，仅使用限流规则）
      transport:
        dashboard: 21.130.247.89:8858
        client-ip: 21.214.97.212
        port: 8719
      # 取消懒加载，启动时立即初始化 Sentinel
      eager: true
    gateway:
      httpclient:
        connect-timeout: 2000       # 全局默认连接超时 2s
        response-timeout: 10s       # 全局默认响应超时 10s
        # T-020: 显式连接池（fixed 池 + 空闲/生命周期限制，避免陈旧连接复用导致的 PrematureClose）
        pool:
          type: fixed
          max-connections: 500
          max-idle-time: 30000
          # T-048 修复：max-life-time 必须 < 下游服务 keep-alive-timeout(60s)，
          # 否则 gateway 复用"已过保活期被对端关闭"的连接发送 body → PrematureClose(500)
          max-life-time: 45000
      routes:
        # ============================================================
        # 注意：metadata 中的超时/限流值为架构文档中的设计规范，
        # 实际生效需要配合自定义 GatewayFilter（见文档 40-gateway-differentiated-strategy.md）。
        # 当前路由使用 spring.cloud.gateway.httpclient 的全局默认值。
        # ============================================================

        # 用户认证（严格限流防暴力破解）
        - id: user-service
          uri: lb://my-xhs-user
          predicates:
            - Path=/api/user/**
          metadata:
            response-timeout: 5000   # 5s
            connect-timeout: 1000    # 1s
            rate-limit-qps: 50       # 用户模块整体 50 QPS

        # 内容服务（读多写少，高 QPS）
        - id: content-service
          uri: lb://my-xhs-content
          predicates:
            - Path=/api/content/**,/api/note/**,/api/comment/**,/api/topic/**
          metadata:
            response-timeout: 3000   # 3s
            connect-timeout: 1000
            rate-limit-qps: 200

        # 搜索服务（最高 QPS）
        - id: search-service
          uri: lb://my-xhs-search
          predicates:
            - Path=/api/search/**
          metadata:
            response-timeout: 2000   # 2s（搜索要快）
            connect-timeout: 500
            rate-limit-qps: 300

        # 下单服务（严格限流 + 较长超时）
        - id: order-service
          uri: lb://my-xhs-order
          predicates:
            - Path=/api/order/**
          metadata:
            response-timeout: 8000   # 8s（下单链路长）
            connect-timeout: 1000
            rate-limit-qps: 10       # 严格限流

        # 支付服务（最严格）
        - id: payment-service
          uri: lb://my-xhs-payment
          predicates:
            - Path=/api/payment/**
          metadata:
            response-timeout: 10000  # 10s（等待第三方支付回调）
            connect-timeout: 2000
            rate-limit-qps: 5

        # 库存服务（内部调用为主，但也暴露给前端查询库存）
        - id: inventory-service
          uri: lb://my-xhs-inventory
          predicates:
            - Path=/api/inventory/**
          metadata:
            response-timeout: 3000
            connect-timeout: 500
            rate-limit-qps: 30

        # 其他路由使用全局默认值
        - id: analytics-service
          uri: lb://my-xhs-analytics
          predicates:
            - Path=/api/analytics/**,/api/social/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 100

        - id: counter-service
          uri: lb://my-xhs-counter
          predicates:
            - Path=/api/counter/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 100

        - id: product-service
          uri: lb://my-xhs-product
          predicates:
            - Path=/api/product/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 100

        - id: cart-service
          uri: lb://my-xhs-cart
          predicates:
            - Path=/api/cart/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 50

        - id: coupon-service
          uri: lb://my-xhs-coupon
          predicates:
            - Path=/api/coupon/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 30

        - id: home-service
          uri: lb://my-xhs-home
          predicates:
            - Path=/api/home/**
          metadata:
            response-timeout: 5000   # 5s（BFF 聚合）
            connect-timeout: 1000
            rate-limit-qps: 50

        - id: notification-service
          uri: lb://my-xhs-notification
          predicates:
            - Path=/api/notification/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 50

        - id: im-service
          uri: lb://my-xhs-im
          predicates:
            - Path=/api/im/**
          metadata:
            response-timeout: 5000   # 5s（WebSocket 建立连接）
            connect-timeout: 2000
            rate-limit-qps: 100

        # 推荐服务（复用 search 服务）
        - id: recommend-service
          uri: lb://my-xhs-search
          predicates:
            - Path=/api/recommend/**
          metadata:
            response-timeout: 3000
            connect-timeout: 1000
            rate-limit-qps: 100

        # AI 诊断台（Gateway 集成 2026-08-17，与 vite dev 代理语义一致）
        # 前端 baseURL=/ai-api（src/api/ai.ts），RewritePath 去掉 /ai-api 前缀 → 后端 /api/** 路径
        # SSE（/api/runs/{id}/stream）31min 超时对齐 AI 后端 SSE_TIMEOUT_MS=31min
        - id: ai-app-service
          uri: lb://my-xhs-ai-app
          predicates:
            - Path=/ai-api/**
          filters:
            - RewritePath=/ai-api/(?<seg>.*), /$\{seg}
          metadata:
            response-timeout: 1860000   # 31min（SSE 长连接，对齐 AI 后端 SSE_TIMEOUT_MS）
            connect-timeout: 3000
            rate-limit-qps: 100
  data:
    redis:
      # Redis 密码 — Nacos shared-configs(my-xhs-common.yaml) 优先，本地为 fallback
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 21.130.247.89:26379
      business:
        port: 6379
      cache:
        port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Gateway 鉴权配置
# 【Nacos 配置】secret 和 hmac-secret 已迁移至 Nacos Config（my-xhs-gateway.yaml）
# 本地仅保留默认值作为 fallback，Nacos 配置优先
# 生产环境密钥通过 Nacos Console 管理，不写入配置文件
gateway:
  auth:
    # JWT 签名密钥（必须与 my-xhs-user 的 jwt.secret 保持一致）
    # 优先从 Nacos 读取，本地值为 fallback
    secret: "MyXhs@2026#JwtSecretKey!ForTokenSign"
    # HMAC-SHA256 签名密钥（用于防篡改+防重放校验，与 JWT 密钥分离）
    # 优先从 Nacos 读取，本地值为 fallback
    hmac-secret: myxhs-hmac-secret-key-2024
    # 白名单路径（不需要鉴权，支持 Ant 风格匹配）
    white-list:
      # ===== 认证相关（注册/登录/验证码/Token刷新/注销） =====
      - /api/user/auth/captcha
      - /api/user/auth/register
      - /api/user/auth/login
      - /api/user/auth/refresh
      - /api/user/auth/logout
      # ===== 公开接口（查看他人主页等） =====
      - /api/user/*/info
      # ===== 笔记公开接口（笔记详情、用户笔记列表） =====
      - /api/note/detail/**
      - /api/note/batch-detail
      - /api/note/user/**
      # ===== 评论公开接口（评论列表、子评论列表、评论计数） =====
      - /api/comment/list/**
      - /api/comment/children/**
      - /api/comment/count/**
      - /api/comment/page/**
      # ===== 社交公开接口（关注列表、粉丝列表） =====
      - /api/social/following/**
      - /api/social/internal/repair-counter/**  # T-022: 管理端点进 JWT 白名单（X-Admin-Call 保护）
      - /api/social/follower/**
      # ===== 点赞公开接口（点赞计数） =====
      - /api/social/like/count
      # ===== 计数公开接口（单个查询、批量查询） =====
      - /api/counter/get
      - /api/counter/batch-get
      # ===== 通知 SSE 端点（ticket-based auth，EventSource 无法带自定义头） =====
      - /api/notification/sse
      - /api/notification/sse/online-count
      # ===== IM 公开端点（在线人数，无需鉴权） =====
      - /api/im/online-count
      # ===== IM WebSocket 握手（浏览器 WS 无法带 Authorization，ticket 在 IM 内部两步鉴权） =====
      - /api/im/ws
      # ===== 优惠券领券中心（公开查询可领券模板列表） =====
      - /api/coupon/template/list
      # ===== 后续模块的公开接口（待扩展） =====
      # - /api/search/**
    # HMAC 签名校验白名单（不需要签名校验的路径，支持 Ant 风格匹配）
    # 安全原则：JWT 鉴权和 HMAC 签名是两个独立安全维度，白名单应独立配置
    # - 登录/注册等认证接口：不需要签名（客户端可能未实现签名逻辑）
    # - 公开读接口：不需要签名（无敏感数据，允许自由访问）
    # - 写接口（下单/支付/发布笔记等）：必须签名，防止参数篡改
    hmac-white-list:
      # ===== 认证相关（客户端登录时可能未初始化签名逻辑） =====
      - /api/user/auth/captcha
      - /api/user/auth/register
      - /api/user/auth/login
      - /api/user/auth/refresh
      - /api/user/auth/logout
      # ===== 公开读接口（无敏感数据，不需要防篡改） =====
      - /api/user/*/info
      - /api/user/me
      - /api/user/me/password
      # T-022: 地址读操作免签（与 /me 一致）；写操作(POST/PUT/DELETE)仍需签名
      - /api/user/address/list
      - /api/user/address/default
      - /api/note/detail/**
      - /api/note/batch-detail
      - /api/note/user/**
      - /api/comment/list/**
      - /api/comment/children/**
      - /api/comment/count/**
      - /api/comment/page/**
      - /api/social/following/**
      - /api/social/follower/**
      - /api/social/like/count
      # ===== 计数/搜索公开读接口 =====
      - /api/counter/get
      - /api/counter/batch-get
      - /api/home/feed
      - /api/home/note/**
      - /api/home/product/**
      - /api/home/user/**
      - /api/search/note
      - /api/search/product
      - /api/search/suggest
      - /api/product/sku/**
      - /api/product/category/**
      - /api/inventory/stock/**
      - /api/im/conversations
      - /api/im/unread-count
      - /api/notification/unread-count
      # ===== 通知 SSE 端点（ticket-based auth，无需 HMAC 签名） =====
      - /api/notification/sse
      - /api/notification/sse/**
      - /api/notification/sse/online-count
      - /api/notification/ticket/**
      # ===== IM 公开端点（在线人数） =====
      - /api/im/online-count
      # ===== IM WebSocket 握手（浏览器 WS 无法带签名头, ticket 在 IM 内部两步鉴权） =====
      - /api/im/ws
      - /api/im/ws/**
      # ===== 管理端点（已由 JWT + X-Admin-Call 双层保护，放行 HMAC） =====
      - /api/coupon/template
      - /api/coupon/template/**
      - /api/product/spu
      - /api/product/spu/**
      - /api/user/internal/**  # T-122: 用户管理端点（删除用户，X-Admin-Call 保护）
      - /api/product/sku
      - /api/inventory/init
      - /api/inventory/reinit
      - /api/counter/reconcile
      - /api/search/index/rebuild
      - /api/search/hot/pin
      - /api/search/hot/block
      - /api/recommend/compute
      - /api/social/internal/repair-counter/**
      # ===== 用户写接口（block/address 等）不再豁免，必须 HMAC 签名 =====
      # ===== AI 诊断台（Gateway 集成 2026-08-17：登录态由 JWT 保证，前端免 HMAC 签名） =====
      - /ai-api/**

# Actuator 健康检查 + 指标暴露
management:
  metrics:
    distribution:
      percentiles-histogram:
        # 2026-08-13：gateway 无 common 的 myxhs_http 指标——开 Boot 自带 http.server.requests 的 bucket
        # （api/tomcat 看板延迟面板正则同时覆盖 myxhs_http 与 http_server_requests）
        "[http.server.requests]": true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.cloud.gateway: info