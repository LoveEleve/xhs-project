service: inventory
priority: P0
role: 强状态库存控制与预扣中心
main_question: inventory 在代码结构里承担什么职责？
key_controllers:
  - InventoryController
key_services:
  - InventoryService
  - InventoryTccService
key_feign_clients: []
key_consumers:
  - OrderTransactionConsumer
  - InventoryDeductConsumer
  - InventoryCacheEvictConsumer
key_jobs:
  - InventoryReconcileJob
key_configs:
  - my-xhs-inventory/src/main/resources/application.yml
responsibility:
  - 预扣/释放/确认库存
  - 处理库存状态推进与一致性
  - 接管订单成立后的库存第一跳
non_responsibility:
  - 不负责订单编排
  - 不负责支付资金状态
sources:
  - /data/workspace/my-xhs/my-xhs-inventory/src/main/java/com/myxhs/inventory/service/InventoryService.java
  - /data/workspace/my-xhs/my-xhs-inventory/src/main/java/com/myxhs/inventory/consumer/OrderTransactionConsumer.java
  - /data/workspace/my-xhs/my-xhs-inventory/src/main/java/com/myxhs/inventory/job/InventoryReconcileJob.java
