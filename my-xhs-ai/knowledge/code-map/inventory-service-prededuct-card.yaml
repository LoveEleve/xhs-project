question: 哪个核心类负责库存预扣主逻辑？
answer_shape: medium
serve_mode: direct
answer: 负责库存预扣主逻辑的核心类是 `InventoryService`，尤其是 `preDeduct()` 及其内部的 `doPreDeduct()` 路径。这里会处理幂等占位、Redis bucket/总量、库存不足、未初始化等关键分支，因此如果你要追库存预扣的真实落点，应该优先看 `InventoryService`。
