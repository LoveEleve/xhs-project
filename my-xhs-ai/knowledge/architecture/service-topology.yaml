id: service-topology
category: architecture
priority: P0
question: my-xhs 的整体架构是什么？
answer_shape: medium
serve_mode: composable
scope: global-architecture
boundary:
  - 不展开每个服务的内部实现细节
  - 不回答具体业务规则（如库存三级扣减细节）
  - 不替代 transaction-chain / async-event-map / middleware-role 等后续卡
answer: >
  my-xhs 不是“16 个并排摆开的 Spring Boot 服务”，而是一个由统一入口、业务服务分层分组、同步编排链和异步扩散网叠加出来的系统。
  其中 gateway 负责统一入口治理；order / inventory / payment 等属于交易主链；home 更偏 BFF 聚合；analytics / counter / notification 等承担动作扩散与视图支撑；
  再往下是 MySQL、Redis、Elasticsearch、RocketMQ、Nacos、XXL-Job 等数据与中间件层。
structured_points:
  entry_layer: gateway 统一接收请求、做路由与鉴权
  core_domains: 用户、内容、商品、购物车、订单、支付、库存、搜索、首页、通知、IM 等按职责分组
  transaction_centers: order 负责同步编排，inventory / payment / coupon 等在链上承担强状态角色
  async_fanout: RocketMQ 把通知、推荐、Feed、补偿等动作异步扩散到下游
  middleware_layer: MySQL / Redis / Elasticsearch / RocketMQ / Nacos / XXL-Job 提供数据与基础设施能力
why_it_matters: >
  这张总图决定了后续所有模块分析的基线：如果先不立住“入口在哪、同步收束在哪、异步扩散在哪”，
  后面的订单、库存、支付、搜索、通知分析就会被看成零散局部实现，而不是同一个分布式系统中的不同角色。
anti_confusion:
  - my-xhs 不是“前端直打每个微服务”的扁平结构
  - 服务数量本身不是复杂度来源，职责差异才是
  - home 不是 transaction center，order 才是交易编排中心
