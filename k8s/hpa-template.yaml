        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600   # 缩容更保守（10 分钟窗口）
      policies:
        - type: Percent
          value: 20
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30    # 扩容更激进
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

