spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2     # Gateway QPS=1000, 2实例=2000 QPS 保底
  maxReplicas: 15    # 搜索流量波动大，扩容上限高
