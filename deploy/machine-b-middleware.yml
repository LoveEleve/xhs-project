version: '3.8'

# ============================================================
# 机器 B：Redis + RocketMQ + ES + Nacos + Canal + Sentinel + XXL-Job
# 预计内存：~7G
# ============================================================

services:
  # ========== Redis × 3 + Sentinel × 3 ==========

  redis-business:
    image: redis:7-alpine
    container_name: my-xhs-redis-business
    network_mode: host
    command: >
      redis-server
      --port 16381 --bind 0.0.0.0 --requirepass Xhs@2026#Redis
      --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy noeviction
      --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16381", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s; timeout: 5s; retries: 3
    volumes:
      - redis-business-data:/data
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: my-xhs-redis-cache
    network_mode: host
    command: >
      redis-server
      --port 16380 --bind 0.0.0.0 --requirepass Xhs@2026#Redis
      --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16380", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s; timeout: 5s; retries: 3
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: my-xhs-redis
    network_mode: host
    command: >
      redis-server
      --port 16379 --bind 0.0.0.0 --requirepass Xhs@2026#Redis
      --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "-a", "Xhs@2026#Redis", "ping"]
      interval: 15s; timeout: 5s; retries: 3
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-1
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-1.conf:/etc/redis/sentinel.conf
    depends_on: [redis, redis-cache, redis-business]
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-2
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-2.conf:/etc/redis/sentinel.conf
    depends_on: [redis, redis-cache, redis-business]
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: my-xhs-redis-sentinel-3
    network_mode: host
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./config/redis/sentinel-3.conf:/etc/redis/sentinel.conf
    depends_on: [redis, redis-cache, redis-business]
    restart: unless-stopped

  # ========== RocketMQ ==========

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-namesrv
    network_mode: host
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: my-xhs-mq-broker
    network_mode: host
    command: sh mqbroker -n 127.0.0.1:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-server -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:11911 || exit 1"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 60s
    volumes:
      - ./config/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf
      - mq-logs:/home/rocketmq/logs
      - mq-store:/home/rocketmq/store
    depends_on: [rocketmq-namesrv]
    restart: unless-stopped

  # ========== Elasticsearch ==========

  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: my-xhs-elasticsearch
    network_mode: host
    cpus: "6"   # A2 调优：2 核配额是搜索吞吐瓶颈（500→1450 RPS）
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=Xhs@2026#Elastic
      - http.port=19200
      - transport.port=19300
      - ES_JAVA_OPTS=-Xms256m -Xmx1g
      - cluster.name=my-xhs-es
      - node.name=es-node-1
    command: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          echo '=== Installing IK Analyzer ===' &&
          elasticsearch-plugin install --batch https://github.com/medcl/elasticsearch-analysis-ik/releases/download/v8.12.2/elasticsearch-analysis-ik-8.12.2.zip 2>/dev/null ||
          echo '=== IK install failed, skip ==='
        fi &&
        /usr/local/bin/docker-entrypoint.sh eswrapper
      "
    deploy:
      resources:
        limits: { cpus: '1', memory: 1536m }
        reservations: { cpus: '0.5', memory: 768m }
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:Xhs@2026#Elastic http://127.0.0.1:19200/_cluster/health?local=true | grep -q 'green\\|yellow'"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 60s
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ========== Canal ==========

  canal:
    image: canal/canal-server:v1.1.7
    container_name: my-xhs-canal
    network_mode: host
    volumes:
      - ./config/canal/conf/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal/conf/note_instance/instance.properties:/home/admin/canal-server/conf/note_instance/instance.properties
      - ./config/canal/conf/product_instance/instance.properties:/home/admin/canal-server/conf/product_instance/instance.properties
      - ./config/canal/conf/inventory_instance/instance.properties:/home/admin/canal-server/conf/inventory_instance/instance.properties
      - canal-data:/home/admin/canal-server/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:11111 || exit 1"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 60s
    depends_on: [rocketmq-broker]
    restart: unless-stopped

  # ========== Nacos ==========

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: my-xhs-nacos
    network_mode: host
    environment:
      MODE: standalone
      NACOS_SERVER_PORT: 18848
      NACOS_SERVER_IP: ${MACHINE_B_IP}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${MACHINE_A_IP}
      MYSQL_SERVICE_PORT: 13306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: Xhs@2026#MySQL
      JVM_XMS: 256m
      JVM_XMX: 512m
    restart: unless-stopped

  # ========== Sentinel Dashboard ==========

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: my-xhs-sentinel-dashboard
    network_mode: host
    environment:
      SERVER_PORT: 18082
    restart: unless-stopped

  # ========== XXL-Job Admin ==========

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: my-xhs-xxl-job-admin
    network_mode: host
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://${MACHINE_A_IP}:13306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=Xhs@2026#MySQL
        --server.port=18080
        --xxl.job.accessToken=my-xhs-xxl-job-token-2026
        --xxl.job.i18n=zh_CN
    restart: unless-stopped

volumes:
  redis-data:
  redis-cache-data:
  redis-business-data:
  mq-logs:
  mq-store:
  es-data:
  canal-data:
