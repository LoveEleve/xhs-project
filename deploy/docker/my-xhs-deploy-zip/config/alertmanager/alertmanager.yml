# Alertmanager 配置（P-D13 告警出口）
# 通知渠道：当前未接入真实告警渠道，使用空接收器（只落日志、不调用任何 webhook）。
# 后续如需通知（企业微信/钉钉/邮箱），替换 receivers[0] 为对应配置即可。
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-noop'

receivers:
  - name: 'default-noop'

