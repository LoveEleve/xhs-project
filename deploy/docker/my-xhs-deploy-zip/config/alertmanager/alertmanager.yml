global:
  resolve_timeout: 5m
route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'
receivers:
  - name: 'default-webhook'
    webhook_configs:
      # 本地告警落地器（systemd: alert-sink.service；落盘 /data2/logs/alerts.jsonl）
      # 如需接企业微信/飞书，替换 URL 或在此增加 receiver 并调整 route
      - url: 'http://127.0.0.1:19099/alert'
        send_resolved: true
