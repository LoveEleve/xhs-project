# my-xhs 告警规则
# 覆盖：系统级 + 应用级 + 业务级

groups:
  # ==================== 应用级告警 ====================
  - name: myxhs_application_alerts
    rules:
      # 5xx 错误率 > 1%（持续 2 分钟）→ P1
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(myxhs_http_request_duration_seconds_count{status_group="5xx"}[5m])) by (application)
            /
            sum(rate(myxhs_http_request_duration_seconds_count[5m])) by (application)
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "服务 {{ $labels.application }} 5xx 错误率超过 1%"
          description: "当前错误率: {{ $value | humanizePercentage }}，持续 2 分钟"

      # P99 响应时间 > 1s（持续 5 分钟）→ P2
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.99,
            sum(rate(myxhs_http_request_duration_seconds_bucket[5m])) by (application, le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "服务 {{ $labels.application }} P99 响应时间超过 1 秒"
          description: "当前 P99: {{ $value | humanizeDuration }}"

      # JVM 堆内存使用率 > 85%（持续 5 分钟）→ P1
      - alert: HighJvmMemoryUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "服务 {{ $labels.application }} JVM 堆内存使用率超过 85%"
          description: "当前使用率: {{ $value | humanizePercentage }}"

      # GC 暂停时间均值 > 500ms → P2
      # 使用 > 0 过滤分母为零的情况（5 分钟内无 GC 事件时 count increase 为 0）
      - alert: HighGcPause
        expr: |
          (
            increase(jvm_gc_pause_seconds_sum[5m])
            /
            (increase(jvm_gc_pause_seconds_count[5m]) > 0)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "服务 {{ $labels.application }} GC 平均暂停时间超过 500ms"
          description: "5 分钟内 GC 平均暂停: {{ $value | humanizeDuration }}"

      # HikariCP 连接池使用率 > 90% → P2
      - alert: HighHikariPoolUsage
        expr: |
          hikaricp_connections_active
          /
          hikaricp_connections_max
          > 0.9
        for: 3m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "服务 {{ $labels.application }} 数据库连接池使用率超过 90%"
          description: "活跃连接: {{ $value }}，可能导致请求排队"

      # 服务实例宕机（Prometheus 采集失败）→ P0
      - alert: ServiceDown
        expr: up{job="my-xhs-services"} == 0
        for: 1m
        labels:
          severity: critical
          level: P0
        annotations:
          summary: "服务 {{ $labels.service }} 实例 {{ $labels.instance }} 宕机"
          description: "Prometheus 无法采集到该实例的指标，持续 1 分钟"

  # ==================== 业务级告警 ====================
  - name: myxhs_business_alerts
    rules:
      # 下单失败率 > 5% → P1
      - alert: HighOrderFailRate
        expr: |
          (
            sum(rate(orders_created_total{status="fail"}[5m]))
            /
            sum(rate(orders_created_total[5m]))
          ) > 0.05
        for: 3m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "下单失败率超过 5%"
          description: "当前失败率: {{ $value | humanizePercentage }}，请立即排查"

      # 支付成功率 < 99% → P1
      - alert: LowPaymentSuccessRate
        expr: |
          (
            sum(rate(payment_callback_total{status="success"}[5m]))
            /
            sum(rate(payment_callback_total[5m]))
          ) < 0.99
        for: 3m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "支付成功率低于 99%"
          description: "当前成功率: {{ $value | humanizePercentage }}"

      # MQ 消费积压 > 10000 → P1
      # - alert: HighMqConsumeLag
#         expr: myxhs_mq_consume_lag > 10000
#         for: 5m
#         labels:
#           severity: warning
#           level: P1
#         annotations:
#           summary: "MQ 消费积压超过 10000"
#           description: "Topic: {{ $labels.topic }}, 消费组: {{ $labels.consumer_group }}, 积压: {{ $value }}"

#       # 登录失败率 > 10% → P2（可能被攻击）
      # - alert: HighLoginFailRate
#         expr: |
#           (
#             sum(rate(myxhs_login_total{status="fail"}[5m]))
#             /
#             sum(rate(myxhs_login_total[5m]))
#           ) > 0.1
#         for: 5m
#         labels:
#           severity: warning
#           level: P2
#         annotations:
#           summary: "登录失败率超过 10%，可能存在暴力破解攻击"
#           description: "当前失败率: {{ $value | humanizePercentage }}"

#   # ==================== 中件间级告警 ====================
#   - name: myxhs_middleware_alerts
#     rules:
#       # Redis 内存使用率 > 80% → P1
      - alert: RedisHighMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 3m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "Redis 内存使用率超过 80%"
          description: "实例: {{ $labels.instance }}, 使用率: {{ $value | humanizePercentage }}"

      # Redis 连接数 > 80% → P2
      - alert: RedisHighConnections
        expr: (redis_connected_clients / redis_config_maxclients) > 0.8
        for: 3m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "Redis 连接数超过 80%"
          description: "实例: {{ $labels.instance }}"

      # ES 集群状态非 green → P1
      - alert: EsClusterNotGreen
        expr: elasticsearch_cluster_health_status{color!="green"} == 1
        for: 2m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "Elasticsearch 集群状态不是 green"
          description: "当前状态: {{ $labels.color }}, 集群: {{ $labels.cluster }}"

      # ES 节点 JVM 堆使用率 > 85% → P2
      - alert: EsNodeHighJvmHeap
        expr: (elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "ES 节点 JVM 堆使用率超过 85%"
          description: "节点: {{ $labels.node }}"

      # Canal 同步延迟 > 60s → P1
      - alert: CanalHighDelay
        expr: canal_instance_traffic_delay{destination!="example"} > 60000
        for: 3m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "Canal 同步延迟超过 60 秒"
          description: "Instance: {{ $labels.destination }}, 延迟: {{ $value }}ms"

      # RocketMQ Broker 磁盘使用率 > 80% → P2
      # - alert: RocketmqHighDiskUsage
#         expr: rocketmq_broker_disk_ratio > 80
#         for: 5m
#         labels:
#           severity: warning
#           level: P2
#         annotations:
#           summary: "RocketMQ Broker 磁盘使用率超过 80%"
#           description: "Broker: {{ $labels.broker }}, 使用率: {{ $value }}%"

#       # DLQ 死信队列有消息 → P1
      - alert: DlqMessageDetected
        # counter 为累计值：用 10m 增量判断"有新死信"，避免历史累积导致永久 firing
        expr: increase(myxhs_mq_dlq_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "DLQ 死信队列检测到消息"
          description: "ConsumerGroup: {{ $labels.consumerGroup }}, Topic: {{ $labels.topic }}, 数量: {{ $value }}"

  # ==================== 核心链路按 4 黄金信号告警 ====================
  - name: myxhs_core_golden_signals
    rules:
      # 订单服务 P99 延迟 > 2s → P1
      - alert: OrderHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(myxhs_http_request_duration_seconds_bucket{application="my-xhs-order"}[5m])) by (le)
          ) > 2
        for: 3m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "订单服务 P99 延迟超过 2 秒"
          description: "当前 P99: {{ $value | humanizeDuration }}"

      # 支付服务 5xx 错误率 > 2% → P0
      - alert: PaymentHighErrorRate
        expr: |
          (
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-payment",status_group="5xx"}[5m]))
            /
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-payment"}[5m]))
          ) > 0.02
        for: 2m
        labels:
          severity: critical
          level: P0
        annotations:
          summary: "支付服务 5xx 错误率超过 2%"
          description: "当前错误率: {{ $value | humanizePercentage }}"

      # 库存服务 QPS 过载预警 > 500/s → P2
      - alert: InventoryHighTraffic
        expr: |
          sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-inventory"}[1m])) > 500
        for: 3m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "库存服务 QPS 超过 500/s"
          description: "当前 QPS: {{ $value }}"

      # 搜索服务 P99 延迟 > 5s → P2
      - alert: SearchHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(myxhs_http_request_duration_seconds_bucket{application="my-xhs-search"}[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "搜索服务 P99 延迟超过 5 秒"
          description: "当前 P99: {{ $value | humanizeDuration }}"

      # 用户服务 5xx 错误率 > 3% → P2
      - alert: UserHighErrorRate
        expr: |
          (
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-user",status_group="5xx"}[5m]))
            /
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-user"}[5m]))
          ) > 0.03
        for: 3m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "用户服务 5xx 错误率超过 3%"
          description: "当前错误率: {{ $value | humanizePercentage }}"

      # 网关 5xx 错误率 > 1% → P1
      - alert: GatewayHighErrorRate
        expr: |
          (
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-gateway",status_group="5xx"}[5m]))
            /
            sum(rate(myxhs_http_request_duration_seconds_count{application="my-xhs-gateway"}[5m]))
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          level: P1
        annotations:
          summary: "网关 5xx 错误率超过 1%"
          description: "当前错误率: {{ $value | humanizePercentage }}"

      # 负载均衡器 QPS 突增 > 正常值 3x → P2
      - alert: TrafficSurge
        expr: |
          sum(rate(myxhs_http_request_duration_seconds_count[5m]))
          /
          avg_over_time(sum(rate(myxhs_http_request_duration_seconds_count[5m] offset 30m))[30m:])
          > 3
        for: 5m
        labels:
          severity: warning
          level: P2
        annotations:
          summary: "总 QPS 比半小时前突增 3 倍以上"
          description: "当前 QPS 比值: {{ $value }}"

  # ==================== MySQL 监控（P-D4 补全，mysqld_exporter） ====================
  - name: myxhs_mysql_alerts
    rules:
      - alert: MysqlDown
        expr: mysql_up == 0
        for: 1m
        keep_firing_for: 2m   # 演练发现：短暂宕机+恢复会被 group_wait 吞掉通知，保留 2m 确保送达
        labels: { severity: critical, level: P0 }
        annotations:
          summary: "MySQL 主库不可达"
          description: "mysql_up == 0，检查 mysqld-exporter 与 MySQL 连接"

      - alert: MysqlSlowQueries
        expr: increase(mysql_global_status_slow_queries[5m]) > 50
        for: 5m
        labels: { severity: warning, level: P2 }
        annotations:
          summary: "MySQL 慢查询突增"
          description: "5 分钟内慢查询 {{ $value }} 次"

      - alert: MysqlThreadsHigh
        expr: (mysql_global_status_threads_connected / mysql_global_variables_max_connections) > 0.8
        for: 5m
        labels: { severity: warning, level: P2 }
        annotations:
          summary: "MySQL 连接数超过 80%"
          description: "当前连接: {{ $value | humanizePercentage }}"

  # ==================== DLQ 积压（rocketmq_dlq_backlog，代码 DlqMetrics Gauge） ====================
  - name: myxhs_rocketmq_dlq_alerts
    rules:
      - alert: RocketmqDlqBacklog
        # max by：多实例/多服务冗余暴露同一 gauge 时只保留每组一条，避免告警 N 倍重复
        expr: max by (consumer_group) (rocketmq_dlq_backlog) > 0
        for: 5m
        labels: { severity: warning, level: P1 }
        annotations:
          summary: "RocketMQ DLQ 死信积压"
          description: "消费组 {{ $labels.consumer_group }} 死信队列积压 {{ $value }} 条，持续 5 分钟"

  # ==================== 主机监控（node_exporter） ====================
  - name: myxhs_node_alerts
    rules:
      - alert: NodeHighCpu
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels: { severity: critical, level: P1 }
        annotations:
          summary: "宿主机 CPU 使用率超过 90%"
          description: "当前 {{ $value | humanizePercentage }}"

      - alert: NodeHighMemory
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: { severity: critical, level: P1 }
        annotations:
          summary: "宿主机内存使用率超过 90%（P-D15 场景）"
          description: "当前 {{ $value | humanizePercentage }}"

      - alert: NodeDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"}) * 100 > 90
        for: 5m
        labels: { severity: warning, level: P2 }
        annotations:
          summary: "根分区磁盘使用率超过 90%"
          description: "当前 {{ $value | humanizePercentage }}"

  # ==================== MySQL 连接与复制韧性（2026-09-17 僵尸连接事故复盘后补） ====================
  - name: myxhs_mysql_conn_alerts
    rules:
      - alert: MysqlConnectionUsageHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 2m
        labels: { severity: warning, level: P1 }
        annotations:
          summary: "MySQL 连接使用率 > 80%"
          description: "threads_connected/max_connections={{ $value | humanizePercentage }}；排查僵尸连接/泄漏，Runbook: docs/ops/alert-runbook.md"

      - alert: MysqlReplicaLagHigh
        expr: mysql_slave_status_seconds_behind_master > 30
        for: 2m
        labels: { severity: warning, level: P1 }
        annotations:
          summary: "MySQL 从库复制延迟 > 30s"
          description: "Seconds_Behind_Master={{ $value }}s；检查大事务/批量 DML/从库负载，Runbook: docs/ops/alert-runbook.md"

      - alert: MysqlLongRunningQueries
        expr: mysql_info_schema_processlist_seconds{command=~"query|execute"} > 60
        for: 1m
        labels: { severity: critical, level: P1 }
        annotations:
          summary: "MySQL 存在 >60s 活跃查询"
          description: "最长执行 {{ $value }}s（僵尸连接事故同特征）；processlist 定位后 KILL，Runbook: docs/ops/alert-runbook.md"

      - alert: MysqlAppConnectionsHigh
        expr: mysql_info_schema_processlist_processes_by_host{client_host="192.168.0.142"} > 250
        for: 5m
        labels: { severity: warning, level: P2 }
        annotations:
          summary: "应用侧 MySQL 连接数 > 250"
          description: "当前 {{ $value }}，排查池空闲回收/僵尸连接，Runbook: docs/ops/alert-runbook.md"

  # ==================== 告警管道心跳（Watchdog，SRE 标准做法） ====================
  - name: myxhs_meta_alerts
    rules:
      - alert: Watchdog
        expr: vector(1)
        for: 1m
        labels: { severity: none, level: P3 }
        annotations:
          summary: "告警管道心跳（收到即代表 Prometheus→Alertmanager→sink 全链路正常）"
          description: "常鸣告警；若长时间收不到，说明通知链路故障（silence/挂掉）"

  # ==================== XXL-Job 调度健康（textfile 指标，2026-09-19 补齐告警缺口） ====================
  - name: myxhs_xxl_job_health
    rules:
      - alert: XxlJobScheduleOrHandleFailures
        expr: xxl_job_trigger_failures_15m > 0 or xxl_job_handle_failures_15m > 0
        for: 5m
        labels: { severity: warning, level: P2 }
        annotations:
          summary: "XXL-Job 近 15 分钟存在调度/执行失败"
          description: "触发失败={{ $value }}（trigger_code!=200）；执行失败见 xxl_job_handle_failures_15m。排查：xxl_job.xxl_job_log"
      - alert: XxlJobHealthCheckDown
        expr: xxl_job_health_ok == 0
        for: 10m
        labels: { severity: critical, level: P1 }
        annotations:
          summary: "XXL-Job 健康巡检失败（DB 不可达或巡检未运行）"
          description: "检查 /etc/cron.d/myxhs-xxl-job-health 与 my-xhs-mysql 连通性"
