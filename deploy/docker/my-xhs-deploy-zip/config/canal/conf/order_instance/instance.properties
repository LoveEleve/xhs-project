#################################################
## 订单库实例：my_xhs_order_0..3 的 t_sub_order_0..3（商家维度子单索引）
## C-004/ITER-004：商家维度订单查询——异构索引（Canal → RocketMQ → ES）
#################################################

# MySQL 连接
canal.instance.master.address = 127.0.0.1:3306
canal.instance.dbUsername = canal
canal.instance.dbPassword = Canal@2026#Sync
canal.instance.connectionCharset = UTF-8

# 订阅规则：4 个分片库 × 4 张子单表（共 16 张物理表；分片键=user_id，商家维度靠本索引）
canal.instance.filter.regex = my_xhs_order_\\d+\\.t_sub_order_\\d+

# 黑名单
canal.instance.filter.black.regex =

# Canal Server ID（必须全局唯一：1001/1002/1003 已占用）
canal.instance.mysql.slaveId = 1004

# MQ Topic（search 域消费者：seller-sub-order-index-sync-group）
canal.mq.topic = SUB_ORDER_INDEX_TOPIC

# 多分区：按主键哈希分区（同一子单的 INSERT/UPDATE 事件保序）
canal.mq.partitionsNum = 3
canal.mq.partitionHash = my_xhs_order_0.t_sub_order_0:id,my_xhs_order_0.t_sub_order_1:id,my_xhs_order_0.t_sub_order_2:id,my_xhs_order_0.t_sub_order_3:id,my_xhs_order_1.t_sub_order_0:id,my_xhs_order_1.t_sub_order_1:id,my_xhs_order_1.t_sub_order_2:id,my_xhs_order_1.t_sub_order_3:id,my_xhs_order_2.t_sub_order_0:id,my_xhs_order_2.t_sub_order_1:id,my_xhs_order_2.t_sub_order_2:id,my_xhs_order_2.t_sub_order_3:id,my_xhs_order_3.t_sub_order_0:id,my_xhs_order_3.t_sub_order_1:id,my_xhs_order_3.t_sub_order_2:id,my_xhs_order_3.t_sub_order_3:id
