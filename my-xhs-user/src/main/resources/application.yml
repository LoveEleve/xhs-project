server:
  port: 19001
  shutdown: graceful  # 优雅停机
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 150
      min-spare: 15
    max-connections: 8192  # 最大连接数（默认8192）
    accept-count: 100     # 等待队列长度（默认100）
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-user
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.130.247.89:18848
        namespace: my-xhs
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 21.130.247.89:18848
        import-check:
          enabled: false
        file-extension: yaml
        shared-configs:
          - data-id: my-xhs-common.yaml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      transport:
        dashboard: 21.130.247.89:8858
        port: 8721
      eager: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 500
            read-timeout: 2000
            logger-level: BASIC
      compression:
        request:
          enabled: true
          mime-types: application/json
        response:
          enabled: true
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  data:
    redis:
      host: 21.130.247.89
      # Redis 密码 — Nacos shared-configs(my-xhs-common.yaml) 优先，本地为 fallback
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 21.130.247.89:26379
      business:
        port: 6379
      cache:
        port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 15    # 最大活跃连接数（默认8，按并发量调整）
          max-idle: 8       # 最大空闲连接数
          min-idle: 4       # 最小空闲连接数（保持预热连接）
          max-wait: 3000ms  # 获取连接最大等待时间（超时快速失败）
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅停机等待时间

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不使用 StdOutImpl（同步输出、性能差、可能泄露敏感数据）
    # 开发调试时可临时改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: "MyXhs@2026#JwtSecretKey!ForTokenSign"
  access-token-expire: 1800000
  refresh-token-expire: 604800000

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # K8s liveness/readiness 探针支持
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: false  # Sentinel 模式下 Redis health check 慢，禁用

# RocketMQ 配置（缓存兜底消费者）
rocketmq:
  name-server: 21.130.247.89:9876
  producer:
    group: user-producer-group
    send-message-timeout: 3000
  consumer:
    group: user-consumer-group

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
spring.datasource.readwrite.enabled: true
