question: 哪个类负责把订单、本地消息表和事件一起写进本地事务？
answer_shape: medium
serve_mode: direct
answer: 负责把订单主表、订单明细、订单事件和本地消息表一起写进本地事务的核心类是 `OrderTransactionService`。如果你问“订单成立时，本地事务到底落了哪些关键锚点”，应该优先看这个类。
