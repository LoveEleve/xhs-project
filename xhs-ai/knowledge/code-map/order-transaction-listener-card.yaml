question: 哪个类负责事务消息回查？
answer_shape: medium
serve_mode: direct
answer: 负责事务消息回查的核心类是 `OrderTransactionListener`，关键职责是根据本地事务与本地消息表状态，回答 Broker 对这笔事务消息到底应该 `COMMIT` 还是 `ROLLBACK`。如果你问“事务回查逻辑在哪”，首先就应该看这个类，尤其是 `checkLocalTransaction` 这一段。
