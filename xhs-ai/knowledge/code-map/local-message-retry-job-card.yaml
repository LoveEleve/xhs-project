question: 哪个 job 负责本地消息补发与死信扫描？
answer_shape: medium
serve_mode: direct
answer: 负责本地消息补发与死信扫描的核心 job 是 `LocalMessageRetryJob`。它承担两件事：一是扫描待补发/失败的本地消息并重新推送到 MQ，二是扫描死信状态的消息并尝试重新投递。因此如果你问“本地消息表为什么能兜底补发”“死信扫描在哪里做”，应该优先看这个 job。
