# 工具选择评测集：question → expected（任一命中即通过；none 表示不应调用工具）
cases:
  - id: TS-01
    question: "当前有哪些 DLQ 消费组有积压？积压量分别多少？"
    expected: [dlq_topic_list]
  - id: TS-02
    question: "cart-sync-consumer-group 的死信为什么失败？给出详情"
    expected: [dlq_message_detail, dlq_topic_list]
  - id: TS-03
    question: "最近1小时 ERROR 日志最多的服务是哪个？给证据"
    expected: [log_top_services]
  - id: TS-04
    question: "查一下 my-xhs-cart 最近30分钟有没有 ERROR 日志，关键词 timeout"
    expected: [log_search]
  - id: TS-05
    question: "最近5分钟各服务 5xx 错误率 Top3，给出证据"
    expected: [metric_top]
  - id: TS-06
    question: "最近5分钟 P95 延迟最慢的 5 个接口，给出数值"
    expected: [metric_top]
  - id: TS-07
    question: "看下 my-xhs-order 最近30分钟的 QPS 趋势，判断是突发还是持续"
    expected: [metric_trend]
  - id: TS-08
    question: "现在哪个消费组积压最多？积压多少？"
    expected: [consumer_lag_top]
  - id: TS-09
    question: "订单为什么是交易链的编排中心？给出来源"
    expected: [knowledge_catalog, knowledge_search, card_read]
  - id: TS-10
    question: "库存预扣的核心方法在哪个类？给出文件:行号"
    expected: [code_locate]
  - id: TS-11
    question: "用 Prometheus 查当前 up=0 的实例"
    expected: [metric_query, metric_labels]
  - id: TS-12
    question: "回答：1+1 等于几？只回数字"
    expected: [none]
  # 轨迹用例：sequence 为有序子序列（部分分），set 用例用 expected 表示集合匹配
  - id: TS-13
    question: "先看下现在哪些消费组有死信积压，再看其中一条死信的具体内容和失败原因"
    sequence: [dlq_topic_list, dlq_message_detail]
  - id: TS-14
    question: "最近5分钟哪个服务 ERROR 日志最多？接着看该服务最近30分钟的 QPS 趋势是突发还是持续"
    sequence: [log_top_services, metric_trend]
  # 2026-09-20 业务只读工具（运维+业务双场景）
  - id: TS-15
    question: "订单 ORD2026092012504092242420044（用户ID 2101534448857354242）现在是什么状态？支付和退款情况如何？"
    expected: [order_trace]
  - id: TS-16
    question: "最近24小时全站订单量、GMV、退款成功金额分别是多少？"
    expected: [order_stats]
  - id: TS-17
    question: "SKU 1 的可用库存、锁定库存、冻结库存分别是多少？"
    expected: [inventory_query]
  - id: TS-18
    question: "用户 2101534448857354242 有哪些优惠券？"
    expected: [coupon_query]

