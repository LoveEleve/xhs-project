server:
  port: 19020
  shutdown: graceful

spring:
  application:
    name: xhs-ai
  mvc:
    async:
      request-timeout: 300000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
  datasource:
    url: ${MYXHS_AI_DB_URL:jdbc:mysql://192.168.0.142:3306/my_xhs_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYXHS_AI_DB_USER:myxhs_ai}
    password: ${MYXHS_AI_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: xhs-ai-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:192.168.0.142:26379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# 鉴权（平台统一模型：网关 JWT → X-User-Id；内部/管理令牌用于服务间与运维）
jwt:
  secret: ${JWT_SECRET:}

myxhs:
  internal:
    token: ${INTERNAL_TOKEN:}
  admin:
    token: ${ADMIN_TOKEN:}

ai:
  model:
    base-url: ${MYXHS_LLM_BASE_URL:https://siyu.site/v1}
    api-key: ${MYXHS_LLM_API_KEY:}
    name: ${MYXHS_LLM_MODEL:deepseek-v4-pro}
  mq:
    namesrv-addr: ${MYXHS_MQ_NAMESRV:127.0.0.1:9876}
    admin-timeout-ms: 5000
  mcp:
    servers:
      elasticsearch:
        enabled: true
        transport: stdio
        command: ${MYXHS_NPX:/opt/node20/bin/npx}
        args: ["-y", "@elastic/mcp-server-elasticsearch@0.1.1"]
        env:
          ES_URL: ${MYXHS_ES_URL:}
          ES_USERNAME: ${MYXHS_ES_USER:}
          ES_PASSWORD: ${MYXHS_ES_PASSWORD:}
          OTEL_SDK_DISABLED: "true"
          PATH: ${MYXHS_MCP_PATH:/opt/node20/bin:/usr/local/bin:/usr/bin:/bin}
          HOME: /root
      prometheus:
        enabled: true
        transport: stdio
        command: /opt/mcp-servers/prometheus-mcp-server
        # 收口：web 监听仅本机；工具白名单只放只读（core 工具恒载：query/range_query/label_*/series/metric_metadata/docs_*）
        args:
          - "--web.listen-address=127.0.0.1:19081"
          - "--mcp.tools=healthy"
          - "--mcp.tools=ready"
          - "--mcp.tools=list_targets"
          - "--mcp.tools=list_alerts"
          - "--mcp.tools=list_rules"
          - "--mcp.tools=alertmanagers"
          - "--mcp.tools=build_info"
          - "--mcp.tools=config"
          - "--mcp.tools=flags"
          - "--mcp.tools=runtime_info"
          - "--mcp.tools=exemplar_query"
        env:
          PROMETHEUS_MCP_SERVER_PROMETHEUS_URL: ${MYXHS_PROM_URL:}
      grafana:
        enabled: true
        transport: stdio
        command: /opt/mcp-servers/mcp-grafana
        args: ["--disable-write"]
        env:
          GRAFANA_URL: ${MYXHS_GRAFANA_URL:}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${MYXHS_GRAFANA_TOKEN:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: xhs-ai

logging:
  config: classpath:logback-spring.xml
