server:
  port: 19020
  shutdown: graceful

spring:
  application:
    name: xhs-ai
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${MYXHS_AI_DB_URL:jdbc:mysql://192.168.0.142:3306/my_xhs_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYXHS_AI_DB_USER:myxhs_ai}
    password: ${MYXHS_AI_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: xhs-ai-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:192.168.0.142:26379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

ai:
  model:
    base-url: ${MYXHS_LLM_BASE_URL:https://siyu.site/v1}
    api-key: ${MYXHS_LLM_API_KEY:}
    name: ${MYXHS_LLM_MODEL:deepseek-v4-pro}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: xhs-ai

logging:
  config: classpath:logback-spring.xml
