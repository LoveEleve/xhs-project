server:
  port: 19002
  shutdown: graceful  # 优雅停机
  tomcat:
    # B3 验证（2026-08-13）：开启 MBean 注册以暴露 tomcat.threads 指标（Micrometer 1.13+ 依赖 mbean）
    mbeanregistry:
      enabled: true
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 150
      min-spare: 15
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-content
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      host: 21.130.247.89
      # Redis 密码 — Nacos shared-configs(my-xhs-common.yaml) 优先，本地为 fallback
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 21.130.247.89:26379
      business:
        port: 6379
      cache:
        port: 6379
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.130.247.89:18848
        namespace: my-xhs
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 21.130.247.89:18848
        import-check:
          enabled: false
        file-extension: yaml
        shared-configs:
          - data-id: my-xhs-common.yaml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      transport:
        dashboard: 21.130.247.89:8858
        port: 8722
      eager: true
    openfeign:
      client:
        config:
          default:
            request-interceptors:
              - com.myxhs.feign.config.FeignInternalCallInterceptor
            connect-timeout: 500
            read-timeout: 2000
            logger-level: BASIC
      compression:
        request:
          enabled: true
          mime-types: application/json
        response:
          enabled: true
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# RocketMQ 配置
rocketmq:
  name-server: 21.130.247.89:9876
  producer:
    group: content-producer-group
    send-message-timeout: 3000

# 文件存储配置
storage:
  type: local
  local:
    path: /data/uploads
    url-prefix: http://21.214.97.212:19002/uploads

# Actuator 健康检查 + 指标暴露
management:
  metrics:
    distribution:
      percentiles-histogram:
        # 2026-08-13：Hikari Timer 默认无 bucket（仅 count/sum/max）——开启后才有 _bucket，histogram_quantile 可用
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        hikaricp.connections.creation: true
        # 业务延迟 Timer（2026-08-13：默认无 bucket——开 percentileHistogram 后 histogram_quantile 可用，biz 看板配套）
        feed.push.latency: true
        orders.create.latency: true
        inventory.prededuct.latency: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info
spring.datasource.readwrite.enabled: true

# 管理/内部接口令牌（环境变量注入，未配置时为空 → 管理接口全部拒绝(fail-closed)）
myxhs:
  admin:
    token: ${ADMIN_TOKEN:}
  internal:
    token: ${INTERNAL_TOKEN:}

jwt:
  secret: "MyXhs@2026#JwtSecretKey!ForTokenSign"
