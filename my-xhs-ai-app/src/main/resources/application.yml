server:
  port: 19020

spring:
  application:
    name: my-xhs-ai-app
  # 指标工具读 my-xhs 真实 MySQL（云主机 21.130.247.89:3306，见部署包）
  # 安全（D2 Gate）：只读账号 myxhs_ai_ro（GRANT SELECT），密码走环境变量，不落库
  datasource:
    url: ${MYXHS_DB_URL:jdbc:mysql://21.130.247.89:3306/my_xhs_order_0?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYXHS_DB_USER:myxhs_ai_ro}
    password: ${MYXHS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5

  # M5 Run Store：AI 自有库（my_xhs_ai，写账号 myxhs_ai_rw，与业务只读账号物理隔离）
  ai-datasource:
    url: ${MYXHS_AI_DB_URL:jdbc:mysql://21.130.247.89:3306/my_xhs_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYXHS_AI_DB_USER:myxhs_ai_rw}
    password: ${MYXHS_AI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 3

myxhs:
  ai:
    llm:
      # LLM 网关（OpenAI 兼容）：OpenCode Go，使用 MiMo V2.5 Pro 付费模型。
      # 密钥不落库，走环境变量；端点与模型均通过 opencode go 模型目录核验。
      base-url: https://opencode.ai/zen/go/v1
      model: mimo-v2.5-pro
      api-key: ${MYXHS_LLM_API_KEY:}
      # 单次模型调用超时（秒）；配合 Harness 失败重试一次，最坏单步 2×超时
      timeout-seconds: 60
    router:
      llm-fallback:
        # LLM 意图分类（主路径，默认开）：规则未命中时交给模型理解意图（问候/超范围/模糊诊断）。
        # 成本极低（flash 单次 ~500 token），远低于误路由进 Agent 白跑调查；可关（纯规则模式）
        enabled: true
    tools:
      # 指标工具访问：mcp（默认，经 my-xhs-ai-mcp 取数）/ direct（直连 MySQL，测试/降级）
      mode: mcp
    agent:
      # D4 受限诊断 Agent：预算三重封顶（设计 §3）+ 成本单价 + 非法输出容忍次数
      # 校准（2026-08-14 实测）：12 条工具结果全文进上下文累计超 30k → 调 100k（步骤预算 15 为主约束）
      # 成本单价 0.002/1k 按 TeamoRouter 估的，OpenCode Go 更便宜（$0.14/M 输入）——M6 成本校准项
      max-steps: 15
      max-tokens: 100000
      max-cost: 1.0
      price-per-1k-tokens: 0.002
      max-invalid-answers: 2
    eval:
      # M6-4 评测门禁阈值（PR 放行红线；实测校准后收紧）
      gate:
        max-hallucination-rate: 10
        min-pass-rate: 60
        min-completion-rate: 40
      # M14 LLM-as-judge（0-5 主观质量分进报告；默认关——成本控制，nightly 开）
      judge:
        enabled: false
      # M14 bad case 回流文件（cwd 相对；jar 部署配绝对路径）
      badcase-file: src/main/resources/eval/cases-badcases.yaml
    rag:
      es-url: ${MYXHS_ES_URL:http://21.130.247.89:19200}
      es-user: ${MYXHS_ES_USER:elastic}
      es-pass: ${MYXHS_ES_PASS:}
      # dense 检索 embedding（火山 Agent Plan 专属端点，doubao-embedding-vision-large 2048 维）
      embedding-url: ${ARK_PLAN_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
      embedding-key: ${ARK_PLAN_API_KEY:}
      embedding-model: ${ARK_EMBEDDING_MODEL:doubao-embedding-vision-large}
    log-search:
      # M9-1 受控日志检索白名单（service=日志文件绝对路径；不在白名单的服务一律拒绝）
      files: ${MYXHS_LOG_SEARCH_FILES:}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  metrics:
    tags:
      application: my-xhs-ai-app

logging:
  level:
    root: info
