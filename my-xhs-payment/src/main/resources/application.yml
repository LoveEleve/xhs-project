server:
  port: 19012
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: my-xhs-payment
  data:
    redis:
      host: localhost
      port: 16379
      password: "Xhs@2026#Redis"
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  datasource:
    url: jdbc:mysql://localhost:13306/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "Xhs@2026#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 60000
  # 支付独立数据源（不走 ShardingSphere 分片路由）
  # PaymentDataSourceConfig 使用此前缀创建独立 DataSource + JdbcTemplate
  # 注意：HikariCP 通过 @ConfigurationProperties 绑定时需要 jdbc-url 而不是 url
  # 原因：Spring Boot 自动配置会做 url → jdbcUrl 的映射，但直接绑定 HikariDataSource 不会
  pay-datasource:
    jdbc-url: jdbc:mysql://localhost:13306/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "Xhs@2026#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: false
        server-addr: 127.0.0.1:18848
        file-extension: yaml
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: localhost:8080
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
      # Nacos 数据源持久化限流规则（Feign 熔断降级规则）
      datasource:
        flow:
          nacos:
            server-addr: 127.0.0.1:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-payment-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: 127.0.0.1:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-payment-degrade-rules
            rule-type: degrade
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# RocketMQ 配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: payment-producer-group
    send-message-timeout: 3000

# Feign 客户端配置
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# 支付超时配置
pay:
  timeout:
    ms: 1800000  # 30分钟（毫秒）

# 退款超时配置
refund:
  timeout:
    days: 15  # 退款中超时天数

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      appname: my-xhs-payment
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info