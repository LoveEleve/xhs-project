server:
  port: 19012
  shutdown: graceful
  tomcat:
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 100
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  application:
    name: my-xhs-payment
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      host: 21.91.124.110
      port: 16379
      # 【Nacos 配置】Redis 密码已迁移至 Nacos Config（my-xhs-redis.yaml），本地值为 fallback
      password: ${spring.data.redis.password:"Xhs@2026#Redis"}
      # Sentinel 高可用配置（取消注释启用 Sentinel 模式，自动覆盖 host:port）
      # sentinel:
      #   master: myMaster
      #   nodes: 21.91.124.110:26379,21.91.124.110:26380,21.91.124.110:26381
      cache:
        port: 16380  # Cache Redis (allkeys-lru)
      business:
        port: 16381  # Business Redis (noeviction)
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  datasource:
    readwrite:
      enabled: true  # 读写分离开关
    # 写库（主库）
    master:
      url: jdbc:mysql://21.91.124.110:13308/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
    # 读库（从库，指向 slave 实例）
    slave:
      url: jdbc:mysql://21.91.124.110:13312/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
      username: root
      password: "Xhs@2026#MySQL"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 5
        maximum-pool-size: 10  # 读库连接池可以小一些
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 10000
        keepalive-time: 30000
        connection-test-query: SELECT 1
        validation-timeout: 3000
  # 支付独立数据源（不走 ShardingSphere 分片路由）
  # PaymentDataSourceConfig 使用此前缀创建独立 DataSource + JdbcTemplate
  # 注意：HikariCP 通过 @ConfigurationProperties 绑定时需要 jdbc-url 而不是 url
  # 原因：Spring Boot 自动配置会做 url → jdbcUrl 的映射，但直接绑定 HikariDataSource 不会
  pay-datasource:
      # 生产环境建议通过环境变量注入：${MYSQL_HOST:21.91.124.110}
    jdbc-url: jdbc:mysql://21.91.124.110:13308/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: root
    password: "Xhs@2026#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      keepalive-time: 30000           # 30s 保活，防止防火墙切断空闲连接
      connection-test-query: SELECT 1  # 连接有效性检测
      validation-timeout: 3000        # 验证超时 3s
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 21.91.124.110:18848
        namespace: my-xhs
        group: DEFAULT_GROUP
      config:
        enabled: true
        server-addr: 21.91.124.110:18848
        import-check:
          enabled: false
        file-extension: yaml
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: 21.91.124.110:18082
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
      # Nacos 数据源持久化限流规则（Feign 熔断降级规则）
      datasource:
        flow:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-payment-flow-rules
            rule-type: flow
        degrade:
          nacos:
            server-addr: 21.91.124.110:18848
            namespace: my-xhs
            group-id: SENTINEL_GROUP
            data-id: my-xhs-payment-degrade-rules
            rule-type: degrade
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 健康检查 + 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# RocketMQ 配置
rocketmq:
  name-server: 21.91.124.110:9876
  producer:
    group: payment-producer-group
    send-message-timeout: 3000

# Feign 客户端配置
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: BASIC
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# 支付超时配置
pay:
  timeout:
    ms: 1800000  # 30分钟（毫秒）

# 退款超时配置
refund:
  timeout:
    days: 15  # 退款中超时天数

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://21.91.124.110:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info

# Dubbo Triple 配置（Provider + Consumer）
dubbo:
  application:
    name: ${spring.application.name}
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://21.91.124.110:18848?namespace=my-xhs
  consumer:
    check: false