server:
  port: 19012
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true  # B3（2026-08-13）：暴露 tomcat.threads 指标
    # Tomcat 线程数按服务特性差异化：网关(入口,IO密集)=300, 库存(锁竞争)=100, 支付(等回调)=100, 其他=150
    threads:
      max: 100
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 30000          # 连接超时 30s
    keep-alive-timeout: 60000          # Keep-Alive 超时 60s
    max-keep-alive-requests: 200       # 单连接最大 200 次请求
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  http2:
    enabled: true

spring:
  config:
    import:
      - optional:nacos:my-xhs-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  main:
    # PaymentService ↔ PayCallbackSimulator 存在调用闭环（模拟回调需回 PaymentService 处理），允许循环引用
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: my-xhs-payment
  # 排除不需要的自动装配，减少内存占用和启动时间
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration
  data:
    redis:
      host: 192.168.0.142
      # Redis 密码 — Nacos 配置(my-xhs-common.yaml) 优先，本地为 fallback
      password: "Xhs@2026#Redis"
      port: 6379
      sentinel:
        master: mymaster
        nodes: 192.168.0.142:26379
      business:
        port: 6379
      cache:
        port: 6379
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms
  pay-datasource:
      # 生产环境建议通过环境变量注入：${MYSQL_HOST:192.168.0.142}
    jdbc-url: jdbc:mysql://192.168.0.142:3306/my_xhs_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&autoReconnect=true&failOverReadOnly=false&connectTimeout=5000&socketTimeout=30000
    username: root
    password: "Xhs@2026#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      keepalive-time: 30000           # 30s 保活，防止防火墙切断空闲连接
      connection-test-query: SELECT 1  # 连接有效性检测
      validation-timeout: 3000        # 验证超时 3s
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        metadata:
          zone: ${MYXHS_ZONE:defaultZone}
      config:
        enabled: true
        server-addr: 192.168.0.142:18848
        namespace: my-xhs
        file-extension: yaml
    # Sentinel 配置（轻量模式，暂不连接 Dashboard）
    sentinel:
      transport:
        dashboard: 192.168.0.142:8858
        port: 8734
      # 取消懒加载，应用启动时即初始化 Sentinel
      eager: true
    openfeign:
      httpclient:
        hc5:
          enabled: true
          max-connections: 200
          max-connections-per-route: 50
      client:
        config:
          default:
            request-interceptors:
              - com.myxhs.feign.config.FeignInternalCallInterceptor
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: BASIC
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Actuator 健康检查 + 指标暴露
management:
  metrics:
    distribution:
      percentiles-histogram:
        # 2026-08-13：Hikari Timer 默认无 bucket（仅 count/sum/max）——开启后才有 _bucket，histogram_quantile 可用
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
        hikaricp.connections.creation: true
        # 业务延迟 Timer（2026-08-13：默认无 bucket——开 percentileHistogram 后 histogram_quantile 可用，biz 看板配套）
        feed.push.latency: true
        orders.create.latency: true
        inventory.prededuct.latency: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: false  # Sentinel 模式下 Redis health check 慢，禁用

# RocketMQ 配置
rocketmq:
  name-server: 192.168.0.142:9876
  producer:
    group: payment-producer-group
    # P2/2026-09-27：显式固定客户端默认重试（此前为隐式默认 2 次）；"发送超时≠失败"，双发靠消费者幂等+对账兜底
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
    send-message-timeout: 3000

# Feign 客户端配置
feign:
  # 启用 Sentinel 作为 Feign 熔断器，FallbackFactory 才能生效
  sentinel:
    enabled: true

# 支付超时配置
pay:
  timeout:
    ms: 1800000  # 30分钟（毫秒）
  # 支付宝渠道契约模拟（C-003/ITER-003）：本地两对密钥——签名/验签流程与线上完全一致，仅密钥自产
  # MOCK-DEV-ONLY：接入真实支付宝时替换为商户实际密钥（配置项结构不变）
  alipay:
    mock:
      app-id: mock-app-2026
      seller-id: mock-seller-2026
      # 应用密钥对：商户签请求 → 模拟服务器验请求
      merchant-private-key: 
      merchant-public-key: 
      # 支付宝密钥对：模拟服务器签通知 → 端点验通知
      alipay-private-key: 
      alipay-public-key: 
      notify-url: http://localhost:19012/api/payment/notify/alipay
      retry-intervals: 5s,15s,60s
      retry-max-attempts: 8
      success-rate: 0.9
      callback-delay-min-ms: 1000
      callback-delay-max-ms: 3000
      # 故障注入：退款调用异常（模拟"调用超时、结果未知"）——默认关闭
      refund-fault-injection: false

# 退款超时配置
refund:
  timeout:
    days: 15  # 退款中超时天数

# XXL-Job 分布式调度配置
xxl:
  job:
    enabled: true
    admin:
      addresses: http://192.168.0.142:18080/xxl-job-admin
    accessToken: my-xhs-xxl-job-token-2026
    executor:
      appname: my-xhs-payment
      port: 9992
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 日志配置
logging:
  level:
    com.myxhs: info
    org.springframework.web: info


spring.datasource.readwrite.enabled: true

# 管理/内部接口令牌（环境变量注入，未配置时为空 → 管理接口全部拒绝(fail-closed)）
myxhs:
  # 结算：手续费率与参与渠道（日终账单/对账）
  settlement:
    fee-rate: 0.0060
    channels: 1,2,99
  admin:
    token: ${ADMIN_TOKEN:}
  internal:
    token: ${INTERNAL_TOKEN:}

jwt:
  secret: ${JWT_SECRET:MyXhs@2026#JwtSecretKey!ForTokenSign}
