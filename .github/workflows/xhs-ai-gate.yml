name: xhs-ai gate
on:
  push:
    paths: ['xhs-ai/**', '.github/workflows/xhs-ai-gate.yml']
  pull_request:
    paths: ['xhs-ai/**']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B -f xhs-ai/pom.xml test
